<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>live sports</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #0d0d0d;
    --surface2: #161616;
    --border: #222222;
    --border2: #333333;
    --text: #e8e8e8;
    --text-dim: #aaaaaa;
    --muted: #666666;
    --red: #ff3b3b;
    --red-dim: rgba(255,59,59,0.1);
    --red-border: rgba(255,59,59,0.25);
    --radius: 6px;
    --tr: 0.15s ease;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ── HEADER ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(0,0,0,0.9);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px;
    display: flex;
    align-items: center;
    height: 52px;
    gap: 16px;
  }

  .logo {
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: var(--text);
    flex-shrink: 0;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
    flex: 1;
    justify-content: flex-end;
  }

  .search-wrap {
    position: relative;
    flex: 1;
    max-width: 260px;
  }

  .search-wrap svg {
    position: absolute;
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--muted);
    pointer-events: none;
    width: 13px;
    height: 13px;
  }

  #search-input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-family: inherit;
    font-size: 13px;
    padding: 6px 12px 6px 30px;
    outline: none;
    transition: border-color var(--tr);
  }
  #search-input:focus { border-color: var(--border2); }
  #search-input::placeholder { color: var(--muted); }

  .live-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--red);
    letter-spacing: 0.08em;
    padding: 4px 10px;
    background: var(--red-dim);
    border-radius: 99px;
    border: 1px solid var(--red-border);
    cursor: pointer;
    transition: background var(--tr);
    user-select: none;
    white-space: nowrap;
  }
  .live-badge:hover { background: rgba(255,59,59,0.18); }

  .live-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 1.4s infinite;
    flex-shrink: 0;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.65); }
  }

  /* ── SPORTS NAV ── */
  .sports-nav-wrap {
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    overflow-x: auto;
    scrollbar-width: none;
  }
  .sports-nav-wrap::-webkit-scrollbar { display: none; }

  .sports-nav {
    display: flex;
    gap: 2px;
    padding: 9px 16px;
    min-width: max-content;
  }

  .sport-btn {
    padding: 5px 13px;
    border-radius: var(--radius);
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: color var(--tr), background var(--tr);
    white-space: nowrap;
  }
  .sport-btn:hover { color: var(--text-dim); background: var(--surface2); }
  .sport-btn.active {
    color: var(--text);
    background: var(--surface2);
    border: 1px solid var(--border2);
  }

  /* ── FILTER TABS ── */
  .filter-tabs {
    padding: 0 20px;
    display: flex;
    gap: 0;
    align-items: center;
    border-bottom: 1px solid var(--border);
  }

  .filter-tab {
    padding: 11px 14px;
    border: none;
    background: transparent;
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color var(--tr), border-color var(--tr);
  }
  .filter-tab:hover { color: var(--text-dim); }
  .filter-tab.active {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .tab-count {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 17px;
    height: 17px;
    padding: 0 5px;
    border-radius: 99px;
    background: var(--surface2);
    font-size: 10px;
    font-weight: 600;
    margin-left: 5px;
    color: var(--muted);
  }
  .filter-tab.active .tab-count {
    background: var(--surface2);
    color: var(--text-dim);
  }

  /* ── MATCHES GRID ── */
  .matches-section {
    padding: 18px 20px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .matches-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
    gap: 8px;
  }

  /* ── MATCH CARD ── */
  .match-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 14px;
    cursor: pointer;
    transition: border-color var(--tr), background var(--tr), transform var(--tr);
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.25s ease both;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .match-card:hover {
    border-color: var(--border2);
    background: var(--surface2);
    transform: translateY(-1px);
  }
  .match-card.is-live::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--red);
  }

  .card-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 11px;
  }

  .card-cat {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    padding: 2px 7px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
  }

  .card-time {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }

  .card-live-pill {
    display: flex;
    align-items: center;
    gap: 4px;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.08em;
    color: var(--red);
    padding: 2px 7px;
    background: var(--red-dim);
    border: 1px solid var(--red-border);
    border-radius: 3px;
  }
  .card-live-dot {
    width: 5px; height: 5px;
    border-radius: 50%;
    background: var(--red);
    animation: pulse 1.4s infinite;
  }

  /* Teams */
  .teams-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 11px;
  }
  .team {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    flex: 1;
  }
  .team-badge {
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface2);
    border: 1px solid var(--border2);
    object-fit: contain;
    padding: 2px;
  }
  .team-badge.placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
  }
  .team-name {
    font-size: 11px;
    font-weight: 500;
    text-align: center;
    color: var(--text);
    line-height: 1.2;
    max-width: 80px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .vs-divider {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    color: var(--border2);
    padding: 0 4px;
    flex-shrink: 0;
  }
  .match-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.4;
    margin-bottom: 10px;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding-top: 10px;
    border-top: 1px solid var(--border);
  }

  .source-chips {
    display: flex;
    gap: 3px;
    flex-wrap: wrap;
  }
  .source-chip {
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.04em;
    color: var(--muted);
    padding: 2px 6px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 3px;
    text-transform: uppercase;
  }

  .watch-btn {
    font-size: 11px;
    font-weight: 600;
    color: #000;
    background: #e8e8e8;
    border: none;
    border-radius: 4px;
    padding: 5px 12px;
    cursor: pointer;
    letter-spacing: 0.02em;
    transition: background var(--tr);
    font-family: inherit;
  }
  .watch-btn:hover { background: #ffffff; }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.88);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 1000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.open { opacity: 1; pointer-events: all; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border2);
    border-radius: 10px;
    width: 100%;
    max-width: 860px;
    max-height: 92vh;
    display: flex;
    flex-direction: column;
    transform: translateY(14px) scale(0.98);
    transition: transform 0.2s ease;
    overflow: hidden;
  }
  .modal-overlay.open .modal { transform: translateY(0) scale(1); }

  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 13px 16px;
    border-bottom: 1px solid var(--border);
    gap: 12px;
    flex-shrink: 0;
  }

  .modal-title-wrap { flex: 1; min-width: 0; }

  .modal-match-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text);
    line-height: 1.2;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .modal-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
  }
  .modal-meta-item {
    font-size: 11px;
    font-weight: 500;
    color: var(--muted);
  }

  .modal-close {
    width: 28px; height: 28px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: color var(--tr), border-color var(--tr);
    flex-shrink: 0;
  }
  .modal-close:hover { color: var(--text); border-color: var(--border2); }

  .modal-body {
    display: flex;
    flex-direction: column;
    overflow-y: auto;
    flex: 1;
  }

  /* Player */
  .player-wrap {
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    background: #000;
    flex-shrink: 0;
  }
  .player-wrap iframe {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: none;
  }
  .player-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--muted);
  }
  .player-placeholder svg { opacity: 0.2; }
  .player-placeholder p { font-size: 13px; color: var(--muted); }

  /* Streams panel */
  .streams-panel {
    padding: 13px 16px;
    border-top: 1px solid var(--border);
    flex-shrink: 0;
  }

  .streams-panel-title {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 9px;
  }

  .source-tabs {
    display: flex;
    gap: 4px;
    flex-wrap: wrap;
    margin-bottom: 9px;
  }

  .source-tab {
    padding: 4px 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    font-family: inherit;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color var(--tr), border-color var(--tr), background var(--tr);
  }
  .source-tab:hover { color: var(--text-dim); border-color: var(--border2); }
  .source-tab.active {
    color: var(--text);
    background: var(--surface2);
    border-color: var(--border2);
    box-shadow: inset 0 0 0 1px var(--border2);
  }

  .stream-list {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
  }

  .stream-btn {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 11px;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--text-dim);
    font-family: inherit;
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: border-color var(--tr), color var(--tr);
  }
  .stream-btn:hover { border-color: var(--border2); color: var(--text); }
  .stream-btn.active {
    border-color: #e8e8e8;
    color: var(--text);
    background: rgba(232,232,232,0.06);
  }

  .stream-hd {
    font-size: 9px;
    font-weight: 700;
    letter-spacing: 0.06em;
    padding: 2px 5px;
    border-radius: 3px;
    background: rgba(232,232,232,0.1);
    color: var(--text-dim);
  }
  .stream-sd {
    font-size: 9px;
    font-weight: 600;
    letter-spacing: 0.06em;
    padding: 2px 5px;
    border-radius: 3px;
    background: rgba(255,255,255,0.04);
    color: var(--muted);
  }

  .streams-loading {
    font-size: 12px;
    color: var(--muted);
    padding: 6px 0;
  }

  /* ── STATES ── */
  .state-empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 60px 24px;
    color: var(--muted);
    text-align: center;
    grid-column: 1/-1;
  }
  .state-empty svg { opacity: 0.15; }
  .state-empty p { font-size: 13px; }

  .state-loading {
    grid-column: 1/-1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px;
    gap: 10px;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.06em;
  }
  .spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--border2);
    border-top-color: var(--text-dim);
    border-radius: 50%;
    animation: spin 0.65s linear infinite;
    flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── SCROLLBAR ── */
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 99px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

  /* ── RESPONSIVE ── */
  @media (max-width: 600px) {
    header { padding: 0 14px; }
    .matches-section { padding: 14px; }
    .filter-tabs { padding: 0 14px; }
    .sports-nav { padding: 8px 10px; }
    .matches-grid { grid-template-columns: 1fr; }
    .modal-header { padding: 11px 13px; }
    .streams-panel { padding: 11px 13px; }
    .search-wrap { max-width: 150px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">live sports</div>
  <div class="header-right">
    <div class="search-wrap">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="6.5" cy="6.5" r="5.5"/>
        <path d="M10.5 10.5L14 14"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search matches…">
    </div>
    <button class="live-badge" onclick="setFilter('live')">
      <span class="live-dot"></span> LIVE
    </button>
  </div>
</header>

<!-- SPORTS NAV -->
<div class="sports-nav-wrap">
  <nav class="sports-nav" id="sports-nav">
    <button class="sport-btn active" data-sport="all" onclick="setSport('all', this)">
      All Sports
    </button>
  </nav>
</div>

<!-- FILTER TABS -->
<div class="filter-tabs">
  <button class="filter-tab active" onclick="setFilter('all', this)">
    All <span class="tab-count" id="count-all">—</span>
  </button>
  <button class="filter-tab" onclick="setFilter('live', this)">
    Live <span class="tab-count" id="count-live">—</span>
  </button>
  <button class="filter-tab" onclick="setFilter('today', this)">
    Today <span class="tab-count" id="count-today">—</span>
  </button>
  <button class="filter-tab" onclick="setFilter('popular', this)">
    Popular <span class="tab-count" id="count-popular">—</span>
  </button>
</div>

<!-- MAIN -->
<div class="matches-section">
  <div class="section-label" id="section-label">All Matches</div>
  <div class="matches-grid" id="matches-grid">
    <div class="state-loading"><div class="spinner"></div> Loading matches…</div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-match-title" id="modal-title">Match Title</div>
        <div class="modal-meta">
          <span class="modal-meta-item" id="modal-time"></span>
          <span class="modal-meta-item" style="color:var(--border2)">·</span>
          <span class="modal-meta-item" id="modal-cat"></span>
        </div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 1l10 10M11 1L1 11"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="player-wrap" id="player-wrap">
        <div class="player-placeholder" id="player-placeholder">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          <p>Loading stream…</p>
        </div>
        <iframe id="stream-iframe" style="display:none" allowfullscreen allow="autoplay; fullscreen"></iframe>
      </div>
      <div class="streams-panel">
        <div class="streams-panel-title">Streams</div>
        <div class="source-tabs" id="source-tabs"></div>
        <div class="stream-list" id="stream-list">
          <div class="streams-loading">Loading…</div>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
const API = 'https://streamed.pk/api';
const IMG = 'https://streamed.pk/api/images';

const SPORT_LABELS = {
  football: 'Football', basketball: 'Basketball', tennis: 'Tennis',
  baseball: 'Baseball', hockey: 'Hockey', mma: 'MMA', boxing: 'Boxing',
  cricket: 'Cricket', volleyball: 'Volleyball', rugby: 'Rugby',
  golf: 'Golf', cycling: 'Cycling', formula1: 'F1', motorsport: 'Motorsport',
  racing: 'Racing', swimming: 'Swimming', athletics: 'Athletics',
  nba: 'NBA', nfl: 'NFL', nhl: 'NHL'
};

let allMatches = [];
let currentFilter = 'all';
let currentSport = 'all';
let searchQuery = '';
let currentMatch = null;
let currentSourceIndex = 0;
let streamsBySource = {};
let activeStreamId = null;
let debounceTimer;

// ── INIT ──
async function init() {
  await Promise.all([loadSports(), loadMatches('all')]);
}

// ── SPORTS ──
async function loadSports() {
  try {
    const res = await fetch(`${API}/sports`);
    const sports = await res.json();
    renderSports(sports);
  } catch(e) { console.error('Sports load failed', e); }
}

function renderSports(sports) {
  const nav = document.getElementById('sports-nav');
  sports.forEach(s => {
    const label = SPORT_LABELS[s.id] || s.name;
    const btn = document.createElement('button');
    btn.className = 'sport-btn';
    btn.dataset.sport = s.id;
    btn.textContent = label;
    btn.onclick = () => setSport(s.id, btn);
    nav.appendChild(btn);
  });
}

function setSport(sport, btn) {
  currentSport = sport;
  document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadMatches(sport === 'all' ? 'all' : sport);
}

// ── MATCHES ──
async function loadMatches(endpoint) {
  const grid = document.getElementById('matches-grid');
  grid.innerHTML = '<div class="state-loading"><div class="spinner"></div> Loading matches…</div>';
  try {
    let url;
    if (endpoint === 'all')   url = `${API}/matches/all`;
    else if (endpoint === 'live')  url = `${API}/matches/live`;
    else if (endpoint === 'today') url = `${API}/matches/all-today`;
    else                           url = `${API}/matches/${endpoint}`;

    const res = await fetch(url);
    allMatches = await res.json();
    updateCounts();
    renderMatches();
  } catch(e) {
    grid.innerHTML = '<div class="state-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><p>Failed to load matches</p></div>';
  }
}

function updateCounts() {
  const now = Date.now();
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayEnd   = new Date(); todayEnd.setHours(23,59,59,999);
  const live    = allMatches.filter(m => isLive(m, now));
  const today   = allMatches.filter(m => m.date >= todayStart && m.date <= todayEnd);
  const popular = allMatches.filter(m => m.popular);
  document.getElementById('count-all').textContent     = allMatches.length;
  document.getElementById('count-live').textContent    = live.length;
  document.getElementById('count-today').textContent   = today.length;
  document.getElementById('count-popular').textContent = popular.length;
}

function isLive(match, now) {
  const start = match.date;
  return start <= now && start >= now - 3 * 3600 * 1000;
}

function getFilteredMatches() {
  const now = Date.now();
  const todayStart = new Date(); todayStart.setHours(0,0,0,0);
  const todayEnd   = new Date(); todayEnd.setHours(23,59,59,999);
  let matches = [...allMatches];
  if      (currentFilter === 'live')    matches = matches.filter(m => isLive(m, now));
  else if (currentFilter === 'today')   matches = matches.filter(m => m.date >= todayStart && m.date <= todayEnd);
  else if (currentFilter === 'popular') matches = matches.filter(m => m.popular);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    matches = matches.filter(m =>
      m.title.toLowerCase().includes(q) ||
      (m.teams?.home?.name || '').toLowerCase().includes(q) ||
      (m.teams?.away?.name || '').toLowerCase().includes(q)
    );
  }
  return matches;
}

function renderMatches() {
  const grid    = document.getElementById('matches-grid');
  const matches = getFilteredMatches();
  const now     = Date.now();

  const labelMap = { all: 'All Matches', live: 'Live Now', today: "Today's Matches", popular: 'Popular Matches' };
  document.getElementById('section-label').textContent = labelMap[currentFilter] || 'Matches';

  if (!matches.length) {
    grid.innerHTML = '<div class="state-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><p>No matches found</p></div>';
    return;
  }

  matches.sort((a, b) => {
    const aLive = isLive(a, now);
    const bLive = isLive(b, now);
    if (aLive && !bLive) return -1;
    if (!aLive && bLive) return 1;
    return a.date - b.date;
  });

  grid.innerHTML = matches.map((m, i) => buildCard(m, now, i)).join('');
}

function buildCard(m, now, i) {
  const live = isLive(m, now);
  const date = new Date(m.date);
  const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  const dateStr = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
  const isToday = new Date().toDateString() === date.toDateString();
  const timeLabel = live ? '' : (isToday ? timeStr : `${dateStr} ${timeStr}`);

  const liveHtml = live
    ? `<span class="card-live-pill"><span class="card-live-dot"></span>LIVE</span>`
    : `<span class="card-time">${timeLabel}</span>`;

  const catId  = m.category || '';
  const sources = (m.sources || []).slice(0, 4);
  const sourceChips = sources.map(s => `<span class="source-chip">${s.source}</span>`).join('');

  let teamsHtml = '';
  if (m.teams?.home || m.teams?.away) {
    const home = m.teams?.home;
    const away = m.teams?.away;
    const homeBadge = home?.badge
      ? `<img class="team-badge" src="${IMG}/badge/${home.badge}.webp" alt="${home?.name || ''}" onerror="this.style.display='none'">`
      : `<div class="team-badge placeholder">${(home?.name||'?')[0]}</div>`;
    const awayBadge = away?.badge
      ? `<img class="team-badge" src="${IMG}/badge/${away.badge}.webp" alt="${away?.name || ''}" onerror="this.style.display='none'">`
      : `<div class="team-badge placeholder">${(away?.name||'?')[0]}</div>`;
    teamsHtml = `
      <div class="teams-row">
        <div class="team">${homeBadge}<span class="team-name">${home?.name || '—'}</span></div>
        <div class="vs-divider">VS</div>
        <div class="team">${awayBadge}<span class="team-name">${away?.name || '—'}</span></div>
      </div>`;
  } else {
    teamsHtml = `<div class="match-title">${m.title}</div>`;
  }

  const delay = Math.min(i * 0.035, 0.4);
  const mJson = JSON.stringify(m).replace(/"/g, '&quot;');

  return `
    <div class="match-card ${live ? 'is-live' : ''}"
         onclick="openMatch(${mJson})"
         style="animation-delay:${delay}s">
      <div class="card-top">
        <span class="card-cat">${catId}</span>
        ${liveHtml}
      </div>
      ${teamsHtml}
      <div class="card-footer">
        <div class="source-chips">${sourceChips}</div>
        <button class="watch-btn">Watch</button>
      </div>
    </div>`;
}

// ── FILTER / SEARCH ──
function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  if (btn) {
    btn.classList.add('active');
  } else {
    document.querySelectorAll('.filter-tab').forEach(b => {
      if (b.getAttribute('onclick') && b.getAttribute('onclick').includes(`'${filter}'`))
        b.classList.add('active');
    });
  }
  renderMatches();
}

document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    searchQuery = e.target.value.trim();
    renderMatches();
  }, 200);
});

// ── MODAL ──
async function openMatch(m) {
  if (typeof m === 'string') m = JSON.parse(m);
  currentMatch = m;
  streamsBySource = {};
  activeStreamId = null;

  const now  = Date.now();
  const live = isLive(m, now);
  const date = new Date(m.date);
  const timeStr = date.toLocaleString([], { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });

  document.getElementById('modal-title').textContent  = m.title;
  document.getElementById('modal-time').textContent   = live ? 'LIVE' : timeStr;
  document.getElementById('modal-cat').textContent    = m.category || '';

  // Reset player
  const iframe = document.getElementById('stream-iframe');
  iframe.src = '';
  iframe.style.display = 'none';
  const placeholder = document.getElementById('player-placeholder');
  placeholder.style.display = 'flex';
  placeholder.querySelector('p').textContent = 'Loading stream…';

  // Reset stream list
  document.getElementById('stream-list').innerHTML = '<div class="streams-loading">Loading…</div>';

  // Build source tabs
  const sources = m.sources || [];
  const tabs = document.getElementById('source-tabs');
  tabs.innerHTML = sources.map((s, i) =>
    `<button class="source-tab ${i === 0 ? 'active' : ''}" onclick="selectSource(${i}, this)">${s.source}</button>`
  ).join('');

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';

  if (sources.length > 0) {
    currentSourceIndex = 0;
    await loadStreamsAndAutoPlay(sources[0]);
  } else {
    placeholder.querySelector('p').textContent = 'No sources available.';
    document.getElementById('stream-list').innerHTML = '<div class="streams-loading">No sources available.</div>';
  }
}

async function selectSource(idx, btn) {
  currentSourceIndex = idx;
  document.querySelectorAll('.source-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const src = currentMatch.sources[idx];
  const key = src.source + src.id;
  if (streamsBySource[key]) {
    renderStreamList(streamsBySource[key]);
  } else {
    document.getElementById('stream-list').innerHTML = '<div class="streams-loading">Loading…</div>';
    await loadStreamsAndAutoPlay(src);
  }
}

async function loadStreamsAndAutoPlay(source) {
  const key = source.source + source.id;
  try {
    const res     = await fetch(`${API}/stream/${source.source}/${source.id}`);
    const streams = await res.json();
    streamsBySource[key] = streams;
    renderStreamList(streams);
    // Auto-play first stream
    if (streams && streams.length > 0) {
      const first = streams[0];
      activeStreamId = first.id;
      // Re-render list so active state is set
      renderStreamList(streams);
      const iframe      = document.getElementById('stream-iframe');
      const placeholder = document.getElementById('player-placeholder');
      iframe.src = first.embedUrl;
      iframe.style.display = 'block';
      placeholder.style.display = 'none';
    } else {
      document.getElementById('player-placeholder').querySelector('p').textContent = 'No streams available.';
    }
  } catch(e) {
    document.getElementById('stream-list').innerHTML = '<div class="streams-loading">Failed to load streams.</div>';
    document.getElementById('player-placeholder').querySelector('p').textContent = 'Failed to load stream.';
  }
}

function renderStreamList(streams) {
  const list = document.getElementById('stream-list');
  if (!streams || !streams.length) {
    list.innerHTML = '<div class="streams-loading">No streams available.</div>';
    return;
  }
  list.innerHTML = streams.map(s => {
    const qual   = s.hd ? `<span class="stream-hd">HD</span>` : `<span class="stream-sd">SD</span>`;
    const active = s.id === activeStreamId ? 'active' : '';
    return `<button class="stream-btn ${active}" onclick="playStream('${s.embedUrl}', '${s.id}', this)">
      ${s.language} #${s.streamNo} ${qual}
    </button>`;
  }).join('');
}

function playStream(url, id, btn) {
  activeStreamId = id;
  document.querySelectorAll('.stream-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const iframe      = document.getElementById('stream-iframe');
  const placeholder = document.getElementById('player-placeholder');
  iframe.src = url;
  iframe.style.display = 'block';
  placeholder.style.display = 'none';
}

function closeModal(e) {
  if (e.target === document.getElementById('modal-overlay')) closeModalDirect();
}

function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
  setTimeout(() => {
    const iframe = document.getElementById('stream-iframe');
    iframe.src = '';
    iframe.style.display = 'none';
    const placeholder = document.getElementById('player-placeholder');
    placeholder.style.display = 'flex';
    placeholder.querySelector('p').textContent = 'Loading stream…';
  }, 220);
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModalDirect();
});

init();
</script>
