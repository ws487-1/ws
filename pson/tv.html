<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iptv</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --surface: #0d0d0d;
    --surface2: #161616;
    --border: #222222;
    --border2: #333333;
    --text: #e8e8e8;
    --text-dim: #aaaaaa;
    --muted: #666666;
    --red: #ff3b3b;
    --red-dim: rgba(255,59,59,0.1);
    --red-border: rgba(255,59,59,0.25);
    --green: #22c55e;
    --radius: 6px;
    --tr: 0.15s ease;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Inter', system-ui, sans-serif;
    font-size: 14px; min-height: 100vh; overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* HEADER */
  header {
    position: sticky; top: 0; z-index: 100;
    background: rgba(0,0,0,0.92); backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--border);
    padding: 0 20px; display: flex; align-items: center; height: 52px; gap: 14px;
  }
  .logo { font-weight: 800; font-size: 15px; letter-spacing: 0.08em; color: var(--text); flex-shrink: 0; text-transform: uppercase; }
  .mode-tabs { display: flex; gap: 2px; flex-shrink: 0; }
  .mode-tab {
    padding: 5px 13px; border-radius: var(--radius); border: 1px solid transparent;
    background: transparent; color: var(--muted); font-family: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer; transition: color var(--tr), background var(--tr), border-color var(--tr);
  }
  .mode-tab:hover { color: var(--text-dim); }
  .mode-tab.active { color: var(--text); background: var(--surface2); border-color: var(--border); }
  .header-right { display: flex; align-items: center; gap: 10px; flex: 1; justify-content: flex-end; }
  .search-wrap { position: relative; flex: 1; max-width: 260px; }
  .search-wrap svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; width: 13px; height: 13px; }
  #search-input {
    width: 100%; background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius); color: var(--text); font-family: inherit;
    font-size: 13px; padding: 6px 12px 6px 30px; outline: none; transition: border-color var(--tr);
  }
  #search-input:focus { border-color: var(--border2); }
  #search-input::placeholder { color: var(--muted); }
  .live-badge {
    display: flex; align-items: center; gap: 5px;
    font-size: 11px; font-weight: 600; color: var(--red); letter-spacing: 0.08em;
    padding: 4px 10px; background: var(--red-dim); border-radius: 99px;
    border: 1px solid var(--red-border); cursor: pointer; transition: background var(--tr);
    user-select: none; white-space: nowrap;
  }
  .live-badge:hover { background: rgba(255,59,59,0.18); }
  .live-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--red); animation: pulse 1.4s infinite; flex-shrink: 0; }
  @keyframes pulse { 0%,100% { opacity:1; transform:scale(1); } 50% { opacity:.4; transform:scale(.65); } }

  /* SUB NAV */
  .sub-nav-wrap { background: var(--bg); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
  .sub-nav-wrap::-webkit-scrollbar { display: none; }
  .sub-nav { display: flex; gap: 2px; padding: 9px 16px; min-width: max-content; }
  .sub-btn {
    padding: 5px 13px; border-radius: var(--radius); border: 1px solid transparent;
    background: transparent; color: var(--muted); font-family: inherit;
    font-size: 13px; font-weight: 500; cursor: pointer;
    transition: color var(--tr), background var(--tr), border-color var(--tr); white-space: nowrap;
  }
  .sub-btn:hover { color: var(--text-dim); background: var(--surface2); }
  .sub-btn.active { color: var(--text); background: var(--surface2); border-color: var(--border2); }

  /* FILTER TABS */
  .filter-tabs { padding: 0 20px; display: flex; align-items: center; border-bottom: 1px solid var(--border); }
  .filter-tab {
    padding: 11px 14px; border: none; background: transparent; color: var(--muted);
    font-family: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color var(--tr), border-color var(--tr);
  }
  .filter-tab:hover { color: var(--text-dim); }
  .filter-tab.active { color: var(--text); border-bottom-color: var(--text); }
  .tab-count {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 17px; height: 17px; padding: 0 5px; border-radius: 99px;
    background: var(--surface2); font-size: 10px; font-weight: 600; margin-left: 5px; color: var(--muted);
  }
  .filter-tab.active .tab-count { color: var(--text-dim); }

  /* SECTION LABEL */
  .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin-bottom: 14px; }

  /* SPORTS GRID */
  .matches-section { padding: 18px 20px; }
  .matches-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 8px; }

  /* MATCH CARD */
  .match-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 13px 14px; cursor: pointer;
    transition: border-color var(--tr), background var(--tr), transform var(--tr);
    position: relative; overflow: hidden; animation: fadeUp 0.25s ease both;
  }
  @keyframes fadeUp { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
  .match-card:hover { border-color: var(--border2); background: var(--surface2); transform: translateY(-1px); }
  .match-card.is-live::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--red); }
  .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:11px; }
  .card-cat { font-size:10px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:2px 7px; background:var(--surface2); border:1px solid var(--border); border-radius:3px; }
  .card-time { font-size:11px; font-weight:500; color:var(--muted); }
  .card-live-pill { display:flex; align-items:center; gap:4px; font-size:10px; font-weight:600; letter-spacing:.08em; color:var(--red); padding:2px 7px; background:var(--red-dim); border:1px solid var(--red-border); border-radius:3px; }
  .card-live-dot { width:5px; height:5px; border-radius:50%; background:var(--red); animation:pulse 1.4s infinite; }
  .teams-row { display:flex; align-items:center; gap:8px; margin-bottom:11px; }
  .team { display:flex; flex-direction:column; align-items:center; gap:5px; flex:1; }
  .team-badge { width:34px; height:34px; border-radius:50%; background:var(--surface2); border:1px solid var(--border2); object-fit:contain; padding:2px; }
  .team-badge.placeholder { display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700; color:var(--muted); }
  .team-name { font-size:11px; font-weight:500; text-align:center; color:var(--text); line-height:1.2; max-width:80px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .vs-divider { font-size:11px; font-weight:700; letter-spacing:.06em; color:var(--border2); padding:0 4px; flex-shrink:0; }
  .match-title { font-size:13px; font-weight:600; color:var(--text); line-height:1.4; margin-bottom:10px; }
  .card-footer { display:flex; align-items:center; justify-content:space-between; padding-top:10px; border-top:1px solid var(--border); }
  .source-chips { display:flex; gap:3px; flex-wrap:wrap; }
  .source-chip { font-size:10px; font-weight:500; letter-spacing:.04em; color:var(--muted); padding:2px 6px; background:var(--surface2); border:1px solid var(--border); border-radius:3px; text-transform:uppercase; }
  .watch-btn { font-size:11px; font-weight:600; color:#000; background:#e8e8e8; border:none; border-radius:4px; padding:5px 12px; cursor:pointer; letter-spacing:.02em; transition:background var(--tr); font-family:inherit; }
  .watch-btn:hover { background:#fff; }

  /* TV SECTION */
  .tv-section { padding: 18px 20px; }
  .tv-filters { display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .tv-toggle { display:flex; align-items:center; gap:7px; font-size:12px; font-weight:500; color:var(--muted); cursor:pointer; user-select:none; margin-left:auto; }
  .tv-toggle input { display:none; }
  .tv-toggle-track { width:32px; height:18px; border-radius:9px; background:var(--border2); position:relative; transition:background var(--tr); flex-shrink:0; }
  .tv-toggle-track::after { content:''; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff; box-shadow:0 1px 3px rgba(0,0,0,.4); transition:transform var(--tr); }
  .tv-toggle input:checked + .tv-toggle-track { background:var(--green); }
  .tv-toggle input:checked + .tv-toggle-track::after { transform:translateX(14px); }
  .tv-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); gap:8px; }

  /* TV CARD */
  .tv-card {
    background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
    padding:12px 12px 10px; cursor:pointer;
    transition:border-color var(--tr), background var(--tr), transform var(--tr);
    display:flex; flex-direction:column; align-items:center; gap:9px; text-align:center;
    animation:fadeUp 0.25s ease both; position:relative; overflow:hidden;
  }
  .tv-card:hover { border-color:var(--border2); background:var(--surface2); transform:translateY(-1px); }
  .tv-card.is-online::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:var(--green); }
  .tv-card.is-offline { opacity:.42; }
  .tv-logo-wrap { width:52px; height:52px; border-radius:8px; background:var(--surface2); border:1px solid var(--border); display:flex; align-items:center; justify-content:center; overflow:hidden; flex-shrink:0; }
  .tv-logo { width:44px; height:44px; object-fit:contain; }
  .tv-logo-placeholder { font-size:10px; font-weight:700; color:var(--muted); text-align:center; line-height:1.3; padding:4px; }
  .tv-name { font-size:11px; font-weight:600; color:var(--text); line-height:1.3; word-break:break-word; max-width:100%; }
  .tv-card-footer { display:flex; align-items:center; justify-content:space-between; width:100%; margin-top:auto; }
  .tv-status { display:flex; align-items:center; gap:4px; font-size:10px; font-weight:600; letter-spacing:.05em; }
  .tv-status.online { color:var(--green); }
  .tv-status.offline { color:var(--muted); }
  .tv-status-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
  .tv-status.online .tv-status-dot { background:var(--green); animation:pulse 2s infinite; }
  .tv-status.offline .tv-status-dot { background:var(--muted); }
  .tv-country { font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:2px 6px; background:var(--surface2); border:1px solid var(--border); border-radius:3px; }

  /* MODAL */
  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.88); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); z-index:1000; display:flex; align-items:center; justify-content:center; padding:16px; opacity:0; pointer-events:none; transition:opacity .2s ease; }
  .modal-overlay.open { opacity:1; pointer-events:all; }
  .modal { background:var(--surface); border:1px solid var(--border2); border-radius:10px; width:100%; max-width:860px; max-height:92vh; display:flex; flex-direction:column; transform:translateY(14px) scale(.98); transition:transform .2s ease; overflow:hidden; }
  .modal-overlay.open .modal { transform:translateY(0) scale(1); }
  .modal-header { display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--border); gap:12px; flex-shrink:0; }
  .modal-title-wrap { flex:1; min-width:0; }
  .modal-match-title { font-size:15px; font-weight:700; color:var(--text); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .modal-meta { display:flex; align-items:center; gap:6px; margin-top:3px; }
  .modal-meta-item { font-size:11px; font-weight:500; color:var(--muted); }
  .modal-close { width:28px; height:28px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface2); color:var(--muted); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:color var(--tr), border-color var(--tr); flex-shrink:0; }
  .modal-close:hover { color:var(--text); border-color:var(--border2); }
  .modal-body { display:flex; flex-direction:column; overflow-y:auto; flex:1; }
  .player-wrap { position:relative; width:100%; aspect-ratio:16/9; background:#000; flex-shrink:0; }
  .player-wrap iframe { position:absolute; inset:0; width:100%; height:100%; border:none; }
  .player-placeholder { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--muted); }
  .player-placeholder svg { opacity:.2; }
  .player-placeholder p { font-size:13px; color:var(--muted); }

  /* Sports streams */
  .streams-panel { padding:13px 16px; border-top:1px solid var(--border); flex-shrink:0; }
  .streams-panel-title { font-size:10px; font-weight:600; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); margin-bottom:9px; }
  .source-tabs { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:9px; }
  .source-tab { padding:4px 11px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface2); color:var(--muted); font-family:inherit; font-size:11px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; cursor:pointer; transition:color var(--tr), border-color var(--tr), background var(--tr); }
  .source-tab:hover { color:var(--text-dim); border-color:var(--border2); }
  .source-tab.active { color:var(--text); background:var(--surface2); border-color:var(--border2); box-shadow:inset 0 0 0 1px var(--border2); }
  .stream-list { display:flex; flex-wrap:wrap; gap:5px; }
  .stream-btn { display:flex; align-items:center; gap:6px; padding:6px 11px; border-radius:var(--radius); border:1px solid var(--border); background:var(--surface2); color:var(--text-dim); font-family:inherit; font-size:12px; font-weight:500; cursor:pointer; transition:border-color var(--tr), color var(--tr); }
  .stream-btn:hover { border-color:var(--border2); color:var(--text); }
  .stream-btn.active { border-color:#e8e8e8; color:var(--text); background:rgba(232,232,232,.06); }
  .stream-hd { font-size:9px; font-weight:700; letter-spacing:.06em; padding:2px 5px; border-radius:3px; background:rgba(232,232,232,.1); color:var(--text-dim); }
  .stream-sd { font-size:9px; font-weight:600; letter-spacing:.06em; padding:2px 5px; border-radius:3px; background:rgba(255,255,255,.04); color:var(--muted); }
  .streams-loading { font-size:12px; color:var(--muted); padding:6px 0; }

  /* TV modal bar */
  .tv-modal-bar { display:none; align-items:center; justify-content:space-between; padding:10px 16px; border-top:1px solid var(--border); flex-shrink:0; }
  .tv-modal-bar.show { display:flex; }
  .tv-modal-channel-name { font-size:13px; font-weight:600; color:var(--text); }
  .tv-modal-status { display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; }
  .tv-modal-status.online { color:var(--green); }
  .tv-modal-status.offline { color:var(--muted); }
  .tv-modal-dot { width:6px; height:6px; border-radius:50%; }
  .tv-modal-status.online .tv-modal-dot { background:var(--green); animation:pulse 2s infinite; }
  .tv-modal-status.offline .tv-modal-dot { background:var(--muted); }

  /* STATES */
  .state-empty { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:60px 24px; color:var(--muted); text-align:center; grid-column:1/-1; }
  .state-empty svg { opacity:.15; }
  .state-empty p { font-size:13px; }
  .state-loading { grid-column:1/-1; display:flex; align-items:center; justify-content:center; padding:60px; gap:10px; color:var(--muted); font-size:12px; font-weight:500; letter-spacing:.06em; }
  .spinner { width:16px; height:16px; border:2px solid var(--border2); border-top-color:var(--text-dim); border-radius:50%; animation:spin .65s linear infinite; flex-shrink:0; }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* SCROLLBAR */
  ::-webkit-scrollbar { width:4px; height:4px; }
  ::-webkit-scrollbar-track { background:transparent; }
  ::-webkit-scrollbar-thumb { background:var(--border2); border-radius:99px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--muted); }

  /* RESPONSIVE */
  @media (max-width: 600px) {
    header { padding:0 12px; gap:10px; }
    .logo { display:none; }
    .matches-section, .tv-section { padding:12px; }
    .filter-tabs { padding:0 12px; }
    .sub-nav { padding:8px 10px; }
    .matches-grid { grid-template-columns:1fr; }
    .tv-grid { grid-template-columns:repeat(auto-fill, minmax(120px,1fr)); gap:6px; }
    .modal-header { padding:11px 13px; }
    .streams-panel { padding:11px 13px; }
    .search-wrap { max-width:150px; }
  }
</style>
</head>
<body>

<!-- HEADER -->
<header>
  <div class="logo">iptv</div>
  <div class="mode-tabs">
    <button class="mode-tab active" id="tab-sports" onclick="setMode('sports',this)">Live Sports</button>
    <button class="mode-tab" id="tab-tv" onclick="setMode('tv',this)">TV</button>
  </div>
  <div class="header-right">
    <div class="search-wrap">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8">
        <circle cx="6.5" cy="6.5" r="5.5"/><path d="M10.5 10.5L14 14"/>
      </svg>
      <input type="text" id="search-input" placeholder="Search matches…">
    </div>
    <button class="live-badge" id="live-badge-btn">
      <span class="live-dot"></span> LIVE
    </button>
  </div>
</header>

<!-- SPORTS PANEL -->
<div id="panel-sports">
  <div class="sub-nav-wrap">
    <nav class="sub-nav" id="sports-nav">
      <button class="sub-btn active" data-sport="all" onclick="setSport('all',this)">All Sports</button>
    </nav>
  </div>
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all',this)">All <span class="tab-count" id="count-all">—</span></button>
    <button class="filter-tab" onclick="setFilter('live',this)">Live <span class="tab-count" id="count-live">—</span></button>
    <button class="filter-tab" onclick="setFilter('today',this)">Today <span class="tab-count" id="count-today">—</span></button>
    <button class="filter-tab" onclick="setFilter('popular',this)">Popular <span class="tab-count" id="count-popular">—</span></button>
  </div>
  <section class="matches-section">
    <div class="section-label" id="section-label">All Matches</div>
    <div class="matches-grid" id="matches-grid">
      <div class="state-loading"><div class="spinner"></div> Loading matches…</div>
    </div>
  </section>
</div>

<!-- TV PANEL -->
<div id="panel-tv" style="display:none">
  <div class="sub-nav-wrap">
    <nav class="sub-nav" id="country-nav">
      <button class="sub-btn active" data-country="all" onclick="setCountry('all',this)">All</button>
    </nav>
  </div>
  <section class="tv-section">
    <div class="tv-filters">
      <div class="section-label" id="tv-section-label" style="margin-bottom:0">All Channels</div>
      <label class="tv-toggle">
        <input type="checkbox" id="online-only-toggle" onchange="renderTV()">
        <span class="tv-toggle-track"></span>
        Online only
      </label>
    </div>
    <div class="tv-grid" id="tv-grid">
      <div class="state-loading"><div class="spinner"></div> Loading channels…</div>
    </div>
  </section>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title-wrap">
        <div class="modal-match-title" id="modal-title">Title</div>
        <div class="modal-meta">
          <span class="modal-meta-item" id="modal-time"></span>
          <span class="modal-meta-item" id="modal-sep" style="color:var(--border2)">·</span>
          <span class="modal-meta-item" id="modal-cat"></span>
        </div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">
        <svg width="11" height="11" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M1 1l10 10M11 1L1 11"/>
        </svg>
      </button>
    </div>
    <div class="modal-body">
      <div class="player-wrap">
        <div class="player-placeholder" id="player-placeholder">
          <svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          <p id="placeholder-text">Loading…</p>
        </div>
        <iframe id="stream-iframe" style="display:none" allowfullscreen allow="autoplay; fullscreen"></iframe>
      </div>
      <div class="streams-panel" id="streams-panel">
        <div class="streams-panel-title">Streams</div>
        <div class="source-tabs" id="source-tabs"></div>
        <div class="stream-list" id="stream-list"><div class="streams-loading">Loading…</div></div>
      </div>
      <div class="tv-modal-bar" id="tv-modal-bar">
        <span class="tv-modal-channel-name" id="tv-modal-name"></span>
        <span class="tv-modal-status" id="tv-modal-status">
          <span class="tv-modal-dot"></span>
          <span id="tv-modal-status-text"></span>
        </span>
      </div>
    </div>
  </div>
</div>

<script>
// ─── CONFIG ───────────────────────────────────────
const SPORTS_API = 'https://streamed.pk/api';
const IMG_API    = 'https://streamed.pk/api/images';
const TV_API     = 'https://api.cdnlivetv.tv/api/v1/channels/?user=cdnlivetv&plan=free';

const COUNTRY_NAMES = {
  us:'United States',gb:'United Kingdom',au:'Australia',nz:'New Zealand',
  za:'South Africa',ca:'Canada',fr:'France',es:'Spain',it:'Italy',
  de:'Germany',pt:'Portugal',nl:'Netherlands',gr:'Greece',dk:'Denmark',
  at:'Austria',pl:'Poland',ru:'Russia',bg:'Bulgaria',cy:'Cyprus',
  rs:'Serbia',hr:'Croatia',be:'Belgium',cz:'Czech Republic',hu:'Hungary',
  se:'Sweden',br:'Brazil',ar:'Argentina',mx:'Mexico',uy:'Uruguay',
  cl:'Chile',co:'Colombia',ro:'Romania',tr:'Turkey',il:'Israel',
  eg:'Egypt',ae:'UAE',sa:'Saudi Arabia','in':'India'
};
// Priority ordering for country nav
const COUNTRY_PRIORITY = ['gb','us','au','ca','nz'];

const SPORT_LABELS = {
  football:'Football',basketball:'Basketball',tennis:'Tennis',baseball:'Baseball',
  hockey:'Hockey',mma:'MMA',boxing:'Boxing',cricket:'Cricket',volleyball:'Volleyball',
  rugby:'Rugby',golf:'Golf',cycling:'Cycling',formula1:'F1',motorsport:'Motorsport',
  racing:'Racing',swimming:'Swimming',athletics:'Athletics',nba:'NBA',nfl:'NFL',nhl:'NHL'
};

// ─── STATE ────────────────────────────────────────
let currentMode    = 'sports';
let allMatches     = [];
let currentFilter  = 'all';
let currentSport   = 'all';
let allChannels    = [];
let currentCountry = 'all';
let sportsSearch   = '';
let tvSearch       = '';
let debounceTimer;
let streamsBySource = {};
let activeStreamId  = null;
let currentMatch    = null;
let tvLoaded        = false;

// ─── MODE SWITCHING ───────────────────────────────
function setMode(mode, btn) {
  currentMode = mode;
  document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('panel-sports').style.display = mode === 'sports' ? '' : 'none';
  document.getElementById('panel-tv').style.display      = mode === 'tv'     ? '' : 'none';
  document.getElementById('live-badge-btn').style.display = mode === 'sports' ? '' : 'none';
  document.getElementById('search-input').placeholder = mode === 'sports' ? 'Search matches…' : 'Search channels…';
  document.getElementById('search-input').value = '';
  sportsSearch = ''; tvSearch = '';
  if (mode === 'sports') renderMatches();
  if (mode === 'tv') {
    if (!tvLoaded) initTV();
    else renderTV();
  }
}

document.getElementById('live-badge-btn').onclick = () => {
  if (currentMode === 'sports') setFilter('live');
};

document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const q = e.target.value.trim();
    if (currentMode === 'sports') { sportsSearch = q; renderMatches(); }
    else                          { tvSearch     = q; renderTV(); }
  }, 200);
});

// ─── SPORTS ───────────────────────────────────────
async function initSports() {
  await Promise.all([loadSports(), loadMatches('all')]);
}

async function loadSports() {
  try {
    const res = await fetch(`${SPORTS_API}/sports`);
    const sports = await res.json();
    const nav = document.getElementById('sports-nav');
    sports.forEach(s => {
      const btn = document.createElement('button');
      btn.className = 'sub-btn';
      btn.dataset.sport = s.id;
      btn.textContent = SPORT_LABELS[s.id] || s.name;
      btn.onclick = () => setSport(s.id, btn);
      nav.appendChild(btn);
    });
  } catch(e) { console.error(e); }
}

function setSport(sport, btn) {
  currentSport = sport;
  document.querySelectorAll('#sports-nav .sub-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadMatches(sport === 'all' ? 'all' : sport);
}

async function loadMatches(endpoint) {
  const grid = document.getElementById('matches-grid');
  grid.innerHTML = '<div class="state-loading"><div class="spinner"></div> Loading matches…</div>';
  try {
    const urlMap = { all:`${SPORTS_API}/matches/all`, live:`${SPORTS_API}/matches/live`, today:`${SPORTS_API}/matches/all-today` };
    const res = await fetch(urlMap[endpoint] || `${SPORTS_API}/matches/${endpoint}`);
    allMatches = await res.json();
    updateCounts();
    renderMatches();
  } catch(e) {
    grid.innerHTML = '<div class="state-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><p>Failed to load matches</p></div>';
  }
}

function isLive(m, now) { return m.date <= now && m.date >= now - 3*3600*1000; }

function updateCounts() {
  const now = Date.now();
  const ts = new Date(); ts.setHours(0,0,0,0);
  const te = new Date(); te.setHours(23,59,59,999);
  document.getElementById('count-all').textContent     = allMatches.length;
  document.getElementById('count-live').textContent    = allMatches.filter(m => isLive(m,now)).length;
  document.getElementById('count-today').textContent   = allMatches.filter(m => m.date>=ts && m.date<=te).length;
  document.getElementById('count-popular').textContent = allMatches.filter(m => m.popular).length;
}

function getFilteredMatches() {
  const now = Date.now();
  const ts = new Date(); ts.setHours(0,0,0,0);
  const te = new Date(); te.setHours(23,59,59,999);
  let ms = [...allMatches];
  if      (currentFilter==='live')    ms = ms.filter(m => isLive(m,now));
  else if (currentFilter==='today')   ms = ms.filter(m => m.date>=ts && m.date<=te);
  else if (currentFilter==='popular') ms = ms.filter(m => m.popular);
  if (sportsSearch) {
    const q = sportsSearch.toLowerCase();
    ms = ms.filter(m => m.title.toLowerCase().includes(q) || (m.teams?.home?.name||'').toLowerCase().includes(q) || (m.teams?.away?.name||'').toLowerCase().includes(q));
  }
  return ms;
}

function renderMatches() {
  const grid = document.getElementById('matches-grid');
  const matches = getFilteredMatches();
  const now = Date.now();
  const labels = {all:'All Matches',live:'Live Now',today:"Today's Matches",popular:'Popular Matches'};
  document.getElementById('section-label').textContent = labels[currentFilter] || 'Matches';
  if (!matches.length) { grid.innerHTML = '<div class="state-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><p>No matches found</p></div>'; return; }
  matches.sort((a,b) => { const al=isLive(a,now),bl=isLive(b,now); if(al&&!bl)return -1; if(!al&&bl)return 1; return a.date-b.date; });
  grid.innerHTML = matches.map((m,i) => buildMatchCard(m,now,i)).join('');
}

function buildMatchCard(m, now, i) {
  const live = isLive(m,now);
  const date = new Date(m.date);
  const timeStr = date.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const dateStr = date.toLocaleDateString([],{month:'short',day:'numeric'});
  const isToday = new Date().toDateString()===date.toDateString();
  const timeLabel = live ? '' : (isToday ? timeStr : `${dateStr} ${timeStr}`);
  const liveHtml = live ? `<span class="card-live-pill"><span class="card-live-dot"></span>LIVE</span>` : `<span class="card-time">${timeLabel}</span>`;
  const sourceChips = (m.sources||[]).slice(0,4).map(s=>`<span class="source-chip">${s.source}</span>`).join('');
  let teamsHtml = '';
  if (m.teams?.home || m.teams?.away) {
    const h=m.teams?.home, a=m.teams?.away;
    const hb = h?.badge ? `<img class="team-badge" src="${IMG_API}/badge/${h.badge}.webp" alt="" onerror="this.style.display='none'">` : `<div class="team-badge placeholder">${(h?.name||'?')[0]}</div>`;
    const ab = a?.badge ? `<img class="team-badge" src="${IMG_API}/badge/${a.badge}.webp" alt="" onerror="this.style.display='none'">` : `<div class="team-badge placeholder">${(a?.name||'?')[0]}</div>`;
    teamsHtml = `<div class="teams-row"><div class="team">${hb}<span class="team-name">${h?.name||'—'}</span></div><div class="vs-divider">VS</div><div class="team">${ab}<span class="team-name">${a?.name||'—'}</span></div></div>`;
  } else { teamsHtml = `<div class="match-title">${m.title}</div>`; }
  const mJson = JSON.stringify(m).replace(/"/g,'&quot;');
  return `<div class="match-card ${live?'is-live':''}" onclick="openMatch(${mJson})" style="animation-delay:${Math.min(i*.035,.4)}s">
    <div class="card-top"><span class="card-cat">${m.category||''}</span>${liveHtml}</div>
    ${teamsHtml}
    <div class="card-footer"><div class="source-chips">${sourceChips}</div><button class="watch-btn">Watch</button></div>
  </div>`;
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else document.querySelectorAll('.filter-tab').forEach(b => { if(b.getAttribute('onclick')?.includes(`'${filter}'`)) b.classList.add('active'); });
  renderMatches();
}

// Sports modal
async function openMatch(m) {
  if (typeof m==='string') m = JSON.parse(m);
  currentMatch = m; streamsBySource = {}; activeStreamId = null;
  const now=Date.now(), live=isLive(m,now);
  const date=new Date(m.date);
  document.getElementById('modal-title').textContent = m.title;
  document.getElementById('modal-time').textContent  = live ? 'LIVE' : date.toLocaleString([],{month:'short',day:'numeric',hour:'2-digit',minute:'2-digit'});
  document.getElementById('modal-cat').textContent   = m.category||'';
  document.getElementById('modal-sep').style.display = m.category ? '' : 'none';
  resetPlayer('Loading stream…');
  document.getElementById('streams-panel').style.display = '';
  document.getElementById('tv-modal-bar').classList.remove('show');
  const sources = m.sources||[];
  document.getElementById('source-tabs').innerHTML = sources.map((s,i) =>
    `<button class="source-tab ${i===0?'active':''}" onclick="selectSource(${i},this)">${s.source}</button>`
  ).join('');
  openModalOverlay();
  if (sources.length) await loadStreamsAndAutoPlay(sources[0]);
  else document.getElementById('placeholder-text').textContent = 'No sources available.';
}

async function selectSource(idx, btn) {
  document.querySelectorAll('.source-tab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const src = currentMatch.sources[idx];
  const key = src.source+src.id;
  if (streamsBySource[key]) renderStreamList(streamsBySource[key]);
  else { document.getElementById('stream-list').innerHTML='<div class="streams-loading">Loading…</div>'; await loadStreamsAndAutoPlay(src); }
}

async function loadStreamsAndAutoPlay(source) {
  const key = source.source+source.id;
  try {
    const res = await fetch(`${SPORTS_API}/stream/${source.source}/${source.id}`);
    const streams = await res.json();
    streamsBySource[key] = streams;
    if (streams && streams.length) {
      activeStreamId = streams[0].id;
      renderStreamList(streams);
      loadIframe(streams[0].embedUrl);
    } else {
      renderStreamList([]);
      document.getElementById('placeholder-text').textContent = 'No streams available.';
    }
  } catch(e) {
    document.getElementById('stream-list').innerHTML='<div class="streams-loading">Failed to load streams.</div>';
  }
}

function renderStreamList(streams) {
  const list = document.getElementById('stream-list');
  if (!streams||!streams.length) { list.innerHTML='<div class="streams-loading">No streams available.</div>'; return; }
  list.innerHTML = streams.map(s => {
    const q = s.hd ? '<span class="stream-hd">HD</span>' : '<span class="stream-sd">SD</span>';
    return `<button class="stream-btn ${s.id===activeStreamId?'active':''}" onclick="playStream('${s.embedUrl}','${s.id}',this)">${s.language} #${s.streamNo} ${q}</button>`;
  }).join('');
}

function playStream(url, id, btn) {
  activeStreamId = id;
  document.querySelectorAll('.stream-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadIframe(url);
}

// ─── TV ───────────────────────────────────────────
async function initTV() {
  tvLoaded = true;
  try {
    const res  = await fetch(TV_API);
    const data = await res.json();
    allChannels = Array.isArray(data) ? data : (data.channels||[]);
    buildCountryNav();
    renderTV();
  } catch(e) {
    document.getElementById('tv-grid').innerHTML='<div class="state-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4m0 4h.01"/></svg><p>Failed to load channels</p></div>';
  }
}

function buildCountryNav() {
  const nav = document.getElementById('country-nav');
  const codes = [...new Set(allChannels.map(c => c.code))].sort((a,b) => {
    const ai=COUNTRY_PRIORITY.indexOf(a), bi=COUNTRY_PRIORITY.indexOf(b);
    if(ai!==-1&&bi!==-1) return ai-bi;
    if(ai!==-1) return -1; if(bi!==-1) return 1;
    return (COUNTRY_NAMES[a]||a).localeCompare(COUNTRY_NAMES[b]||b);
  });
  codes.forEach(code => {
    const btn = document.createElement('button');
    btn.className = 'sub-btn';
    btn.dataset.country = code;
    btn.textContent = COUNTRY_NAMES[code] || code.toUpperCase();
    btn.onclick = () => setCountry(code, btn);
    nav.appendChild(btn);
  });
}

function setCountry(country, btn) {
  currentCountry = country;
  document.querySelectorAll('#country-nav .sub-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTV();
}

function renderTV() {
  const grid       = document.getElementById('tv-grid');
  const onlineOnly = document.getElementById('online-only-toggle').checked;
  let channels = [...allChannels];
  if (currentCountry !== 'all') channels = channels.filter(c => c.code === currentCountry);
  if (onlineOnly)               channels = channels.filter(c => c.status === 'online');
  if (tvSearch) { const q=tvSearch.toLowerCase(); channels=channels.filter(c=>c.name.toLowerCase().includes(q)); }
  const label = currentCountry==='all' ? 'All Channels' : (COUNTRY_NAMES[currentCountry]||currentCountry.toUpperCase());
  document.getElementById('tv-section-label').textContent = `${label} — ${channels.length} channel${channels.length!==1?'s':''}`;
  if (!channels.length) { grid.innerHTML='<div class="state-empty"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><p>No channels found</p></div>'; return; }
  channels.sort((a,b) => { if(a.status==='online'&&b.status!=='online')return -1; if(a.status!=='online'&&b.status==='online')return 1; return a.name.localeCompare(b.name); });
  grid.innerHTML = channels.map((ch,i) => buildTVCard(ch,i)).join('');
}

function buildTVCard(ch, i) {
  const online = ch.status==='online';
  const statusHtml = online
    ? `<span class="tv-status online"><span class="tv-status-dot"></span>On Air</span>`
    : `<span class="tv-status offline"><span class="tv-status-dot"></span>Offline</span>`;
  const logoHtml = ch.image
    ? `<img class="tv-logo" src="${ch.image}" alt="${ch.name.replace(/"/g,'')}" onerror="this.parentElement.innerHTML='<div class=tv-logo-placeholder>${ch.name.substring(0,8).replace(/'/g,'')}</div>'">`
    : `<div class="tv-logo-placeholder">${ch.name.substring(0,8)}</div>`;
  const chJ = JSON.stringify({name:ch.name,url:ch.url,status:ch.status,code:ch.code}).replace(/"/g,'&quot;');
  return `<div class="tv-card ${online?'is-online':'is-offline'}" onclick="openTV(${chJ})" style="animation-delay:${Math.min(i*.012,.5)}s">
    <div class="tv-logo-wrap">${logoHtml}</div>
    <div class="tv-name">${ch.name}</div>
    <div class="tv-card-footer">${statusHtml}<span class="tv-country">${ch.code.toUpperCase()}</span></div>
  </div>`;
}

function openTV(ch) {
  if (typeof ch==='string') ch=JSON.parse(ch);
  document.getElementById('modal-title').textContent = ch.name;
  document.getElementById('modal-time').textContent  = COUNTRY_NAMES[ch.code]||ch.code.toUpperCase();
  document.getElementById('modal-cat').textContent   = '';
  document.getElementById('modal-sep').style.display = 'none';
  resetPlayer('Loading channel…');
  document.getElementById('streams-panel').style.display = 'none';
  // info bar
  document.getElementById('tv-modal-name').textContent = ch.name;
  document.getElementById('tv-modal-status-text').textContent = ch.status==='online' ? 'On Air' : 'Offline';
  document.getElementById('tv-modal-status').className = `tv-modal-status ${ch.status==='online'?'online':'offline'}`;
  document.getElementById('tv-modal-bar').classList.add('show');
  openModalOverlay();
  loadIframe(ch.url);
}

// ─── SHARED MODAL ─────────────────────────────────
function resetPlayer(msg) {
  const iframe = document.getElementById('stream-iframe');
  iframe.src = ''; iframe.style.display='none';
  document.getElementById('player-placeholder').style.display='flex';
  document.getElementById('placeholder-text').textContent = msg;
  document.getElementById('stream-list').innerHTML='<div class="streams-loading">Loading…</div>';
  document.getElementById('source-tabs').innerHTML='';
}

function loadIframe(url) {
  const iframe = document.getElementById('stream-iframe');
  iframe.src = url; iframe.style.display='block';
  document.getElementById('player-placeholder').style.display='none';
}

function openModalOverlay() {
  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function closeModal(e) { if(e.target===document.getElementById('modal-overlay')) closeModalDirect(); }

function closeModalDirect() {
  document.getElementById('modal-overlay').classList.remove('open');
  document.body.style.overflow='';
  setTimeout(() => {
    const iframe=document.getElementById('stream-iframe');
    iframe.src=''; iframe.style.display='none';
    document.getElementById('player-placeholder').style.display='flex';
    document.getElementById('placeholder-text').textContent='Loading…';
    document.getElementById('tv-modal-bar').classList.remove('show');
    document.getElementById('streams-panel').style.display='';
  }, 220);
}

document.addEventListener('keydown', e => { if(e.key==='Escape') closeModalDirect(); });

// ─── INIT ─────────────────────────────────────────
initSports();
</script>
</body>
</html>
