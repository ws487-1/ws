<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>TV</title>
</head>
<body>
<div id="player"></div>
<p id="now"></p>
<button id="unmute">Unmute</button>

<script>
// EDIT THIS LIST. id = YouTube video ID, duration = length in seconds.
// These are placeholder entries: replace with your own videos and real durations.
const VIDEOS = [
  { id: "dQw4w9WgXcQ", duration: 213 },
  { id: "9bZkp7q19f0", duration: 252 },
  { id: "kJQP7kiw5Fk", duration: 282 },
];

// Fixed start time of the "channel". Don't change it once live,
// or the schedule will jump.
const EPOCH = Date.UTC(2026, 0, 1);

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Each full loop through the list uses a different shuffled order.
function orderForCycle(cycle) {
  const rand = mulberry32(cycle + 1);
  const list = VIDEOS.slice();
  for (let i = list.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [list[i], list[j]] = [list[j], list[i]];
  }
  return list;
}

const TOTAL = VIDEOS.reduce((s, v) => s + v.duration, 0);

// What should be playing right now, and how far in. skip = number of
// videos to skip ahead (used when one fails to load).
function nowPlaying(skip = 0) {
  let t = (Date.now() - EPOCH) / 1000;
  let cycle = Math.floor(t / TOTAL);
  let offset = t - cycle * TOTAL;
  let order = orderForCycle(cycle);
  let i = 0;
  while (i < order.length - 1 && offset >= order[i].duration) {
    offset -= order[i].duration;
    i++;
  }
  let startedAt = Date.now() - offset * 1000;
  for (let k = 0; k < skip; k++) {
    startedAt += order[i].duration * 1000;
    i++;
    if (i >= order.length) {
      cycle++;
      order = orderForCycle(cycle);
      i = 0;
    }
    offset = 0;
  }
  return { video: order[i], offset: skip ? 0 : offset, index: i, cycle };
}

let player, timer, skip = 0, lastLoad = 0, failures = 0, stopped = false;
const MIN_GAP = 3000; // never load a new video more often than every 3s
const MAX_FAILURES = 5; // give up after this many failures in a row
const status = (msg) => { document.getElementById("now").textContent = msg; };

function play() {
  clearTimeout(timer);
  if (stopped) return;
  // Rate limit: if we loaded something very recently, wait before the next load.
  const wait = lastLoad + MIN_GAP - Date.now();
  if (wait > 0) { timer = setTimeout(play, wait); return; }
  lastLoad = Date.now();
  const n = nowPlaying(skip);
  status("Now playing: " + n.video.id + " (" + (n.index + 1) + "/" + VIDEOS.length + ")");
  player.loadVideoById({ videoId: n.video.id, startSeconds: Math.floor(n.offset) });
  const remaining = Math.max(n.video.duration - n.offset, 1);
  // When the scheduled slot ends, re-sync to the schedule.
  timer = setTimeout(() => { skip = 0; play(); }, remaining * 1000 + 500);
}

function onYouTubeIframeAPIReady() {
  const n = nowPlaying();
  player = new YT.Player("player", {
    width: 640,
    height: 360,
    videoId: n.video.id,
    host: "https://www.youtube-nocookie.com",
    playerVars: {
      autoplay: 1, mute: 1, controls: 0, disablekb: 1, playsinline: 1,
      origin: location.origin, start: Math.floor(n.offset),
    },
    events: {
      onReady: () => { play(); },
      onStateChange: (e) => {
        if (e.data === YT.PlayerState.PLAYING) failures = 0;
        // Video ended before its slot did (duration in the list is too long): go to the next one.
        if (e.data === YT.PlayerState.ENDED) { skip++; play(); }
      },
      onError: (e) => {
        failures++;
        if (failures >= MAX_FAILURES) {
          stopped = true;
          clearTimeout(timer);
          status("Stopped: YouTube error " + e.data + ". 101/150/153 = embedding blocked or page opened as a local file (needs http/https).");
          return;
        }
        skip++; // deleted or embed-blocked: try the next one (rate limited by MIN_GAP)
        play();
      },
    },
  });
}

document.getElementById("unmute").onclick = () => { player.unMute(); player.setVolume(100); };
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
