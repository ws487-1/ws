<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>Prosper · Design system</title>
<link rel="stylesheet" href="../cards/styles.css">
<script src="../../fonts.js"></script><script src="../cards/fonts-inject.js"></script><script src="../cards/theme.js"></script>
<script src="../cards/fixtures.js"></script><script src="../cards/normalise.js"></script><script src="../cards/components.js"></script>
<style>
  .ds { max-width: 1240px; margin: 0 auto; padding: 32px 24px 80px; }
  .ds > header p { max-width: 720px; }
  .ds h2 { font-size: var(--fs-xl); margin: 48px 0 6px; letter-spacing: -.01em; }
  .ds h2 + p { margin: 0 0 18px; color: var(--ink-600); max-width: 760px; }
  .ds h3.g { font-size: var(--fs-sm); color: var(--ink-600); font-weight: var(--fw-semibold); margin: 22px 0 10px; }
  .sw-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 10px; }
  .sw { border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden; background: var(--surface); }
  .sw .c { height: 56px; border-bottom: 1px solid var(--line); }
  .sw .k { padding: 8px 10px 0; font: 500 12px/1.3 var(--font-mono); color: var(--ink-900); }
  .sw .h { padding: 2px 10px 8px; font: 11px/1.3 var(--font-mono); color: var(--ink-500); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 0; border: 1px solid var(--line); border-radius: var(--r-lg); overflow: hidden; }
  .two > section { padding: 24px; background: var(--bg); color: var(--ink-800); min-width: 0; }
  .two > section > .eyebrow { margin-bottom: 14px; display: block; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  .type-row { display: grid; grid-template-columns: 150px 1fr; gap: 16px; align-items: baseline; padding: 10px 0; border-bottom: 1px solid var(--line-soft); }
  .type-row .k { font: 12px var(--font-mono); color: var(--ink-500); }
  .sp-row { display: grid; grid-template-columns: 90px 60px 1fr; gap: 12px; align-items: center; padding: 4px 0; font: 12px var(--font-mono); color: var(--ink-600); }
  .sp-row i { display: block; height: 12px; background: var(--accent-600); border-radius: 2px; }
  .rad-grid, .sh-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 14px; }
  .rad-grid > div, .sh-grid > div { height: 84px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: end start; padding: 8px 10px; font: 12px var(--font-mono); color: var(--ink-600); }
  .sh-grid { grid-template-columns: repeat(3, 1fr); } .sh-grid > div { border-radius: var(--r-md); border-color: transparent; }
  .rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .rules .tile h3 { font-size: var(--fs-sm); margin-bottom: 6px; } .rules .tile p { margin: 0; font-size: var(--fs-sm); color: var(--ink-600); }
  .stack > * + * { margin-top: 14px; }
  @media (max-width: 1100px) { .two { grid-template-columns: 1fr; } .rules { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<div class="topbar">
  <a class="wordmark" href="../">Prosper</a><span class="tag">Design system</span><span class="grow"></span>
  <a class="btn ghost sm" href="../cards/">Company card</a>
  <button class="btn ghost sm" id="themeBtn">Dark</button>
</div>
<div class="ds" id="ds"></div>
<script>
(function () {
  'use strict';
  Theme.button(document.getElementById('themeBtn'));
  Normalise.setEnums(window.CH_ENUMS);
  const vm = Normalise.company(window.CH_FIXTURES['15597908']);
  const vmBad = Normalise.company(window.CH_FIXTURES['03782379']);
  const C = window.Cards, esc = C.esc;
  const G = {
    'Neutrals (charcoal)': ['--ink-900', '--ink-800', '--ink-700', '--ink-600', '--ink-500', '--ink-400', '--ink-300', '--ink-200'],
    'Surfaces and lines': ['--surface', '--surface-2', '--surface-sunk', '--bg', '--line', '--line-soft'],
    'Accent (inky indigo)': ['--accent-900', '--accent-700', '--accent-600', '--accent-500', '--accent-200', '--accent-100', '--accent-50'],
    'Status': ['--ok', '--ok-bg', '--ok-line', '--warn', '--warn-bg', '--warn-line', '--bad', '--bad-bg', '--bad-line', '--neutral', '--neutral-bg', '--neutral-line'],
    'AI only (summary shimmer, nowhere else)': ['--ai-violet', '--ai-amber', '--ai-wash-a', '--ai-wash-b'],
  };
  const swatches = (el) => { const cs = getComputedStyle(el); return Object.entries(G).map(([g, ks]) => `<h3 class="g">${esc(g)}</h3><div class="sw-grid">${ks.map((k) => `<div class="sw"><div class="c" style="background:var(${k})"></div><div class="k">${k}</div><div class="h">${esc(cs.getPropertyValue(k).trim())}</div></div>`).join('')}</div>`).join(''); };
  const sample = () => `<div class="stack">
    <div class="row">${C.pill('Active', 'ok')}${C.pill('Overdue', 'warn')}${C.pill('Liquidation', 'bad')}${C.pill('Dissolved', 'neutral')}${C.pill('2 PSCs', 'accent')}<span class="chip"><b class="mono">68209</b>Letting of own property</span></div>
    <div class="row"><button class="btn primary">Primary</button><button class="btn">Secondary</button><button class="btn ghost">Ghost</button><button class="btn sm">Small</button><input class="input" placeholder="Input"></div>
    <div class="facts">${vm.keyFacts.slice(0, 4).map(C.factTile).join('')}</div>
    <div class="tile">${C.deadlines(vm, { tag: 'tile', details: false })}</div>
    <div class="tile">${C.charges(vm, { tag: 'tile', limit: 1 })}</div>
    <div class="tile">${C.ai(vm)}</div>
    <div class="empty">No people with significant control on record, and no statement explaining why.</div>
  </div>`;
  const ds = document.getElementById('ds');
  ds.innerHTML = `<header><h1 style="font-size:30px;letter-spacing:-.02em">Design system</h1>
    <p class="muted">The tokens and components behind the Prosper prototypes. Everything is a CSS custom property in <a href="../cards/styles.css">cards/styles.css</a>. The dark theme redefines the same names under <span class="mono">[data-theme="dark"]</span>, so components need no theme-specific code.</p></header>

    <h2>Principles</h2><p>Plain business tool. Data first, chrome last.</p>
    <div class="rules">
      <div class="tile"><h3>White and charcoal</h3><p>Neutral surfaces, charcoal text. Colour is for meaning (status), not decoration.</p></div>
      <div class="tile"><h3>One accent</h3><p>Inky indigo for links, focus and primary actions. Never bright violet.</p></div>
      <div class="tile"><h3>AI is marked</h3><p>Violet and amber appear only on AI output, so it is always clear what is generated and what is on the public record.</p></div>
      <div class="tile"><h3>Inter for text</h3><p>Tabular numbers everywhere. DM Sans 700 is used only for the wordmark.</p></div>
      <div class="tile"><h3>Factual wording</h3><p>Say what the register shows. "Likely", never "Probably". No accusations.</p></div>
      <div class="tile"><h3>Status is triple-coded</h3><p>Text colour, tint and border, plus words, so nothing relies on colour alone.</p></div>
    </div>

    <h2>Colour</h2><p>Light and dark, side by side. The hex values are read live from the stylesheet.</p>
    <div class="two"><section data-theme="light" id="l"><span class="eyebrow">Light</span></section><section data-theme="dark" id="d"><span class="eyebrow">Dark</span></section></div>

    <h2>Type</h2><p>Inter, 4 weights. The scale runs 11 to 30px and is tuned for dense data, with 14px body text.</p>
    <div class="tile">
      <div class="type-row"><span class="k">wordmark · 700</span><span class="wordmark" style="font-size:28px">Prosper</span></div>
      ${[['2xl', 600, 'Tesco PLC'], ['xl', 600, 'Section title'], ['lg', 600, 'Card heading · 27 years'], ['md', 600, 'Tile heading'], ['base', 400, 'Body text. Incorporated 27 Nov 1947, Welwyn Garden City.'], ['sm', 400, 'Secondary text and table cells: 1,234,567'], ['xs', 500, 'Meta, chips and captions'], ['2xs', 600, 'EYEBROW LABEL']].map(([k, w, t]) => `<div class="type-row"><span class="k">--fs-${k} · ${w}</span><span style="font-size:var(--fs-${k});font-weight:${w};color:var(--ink-900);${k === '2xs' ? 'letter-spacing:var(--tracking-caps)' : ''}">${esc(t)}</span></div>`).join('')}
    </div>

    <h2>Space</h2><p>4px base. Components use 8 to 16px inside and 24 to 32px between sections.</p>
    <div class="tile">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<div class="sp-row"><span>--sp-${n}</span><span></span><i style="width:var(--sp-${n})"></i></div>`).join('')}</div>

    <h2>Radius</h2><p>Small radii for controls, larger ones for cards.</p>
    <div class="rad-grid">${['xs', 'sm', 'md', 'lg', 'xl', 'pill'].map((k) => `<div style="border-radius:var(--r-${k})">--r-${k}</div>`).join('')}</div>

    <h2>Elevation</h2><p>Three soft shadows. Most surfaces use a border plus --sh-2; dialogs use --sh-3.</p>
    <div class="sh-grid">${[1, 2, 3].map((n) => `<div style="box-shadow:var(--sh-${n})">--sh-${n}</div>`).join('')}</div>

    <h2>Components</h2><p>Real components, rendered from a saved company (AIM Properties) in both themes.</p>
    <div class="two"><section data-theme="light" id="cl"></section><section data-theme="dark" id="cd"></section></div>

    <h2>Header with warnings</h2><p>A company in liquidation (Carillion): the status, the heads-up line and the flags.</p>
    <div class="two"><section data-theme="light"><div class="card">${C.header(vmBad)}</div></section><section data-theme="dark"><div class="card">${C.header(vmBad)}</div></section></div>`;
  for (const id of ['l', 'd']) { const el = document.getElementById(id); el.insertAdjacentHTML('beforeend', swatches(el)); }
  document.getElementById('cl').innerHTML = sample(); document.getElementById('cd').innerHTML = sample();
})();
</script>
</body>
</html>
