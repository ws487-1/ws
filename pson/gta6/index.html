    <script type="module" src="https://cdn.jsdelivr.net/npm/@videojs/html/cdn/video.js"></script>
    <style>
        * {
            box-sizing: border-box;
        }
        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2px;
            width: 100vw;
        }
        .media {
            width: 100%;
            height: 100%;
            min-height: 50vh;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }
        video-player {
            width: 100%;
            height: 100%;
        }
        video-skin {
            width: 100%;
            height: 100%;
            display: block;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }
        @media (max-width: 800px) {
            .grid {
                grid-template-columns: 1fr;
            }
            .media {
                min-height: auto;
            }
        }
    </style>
</head>
