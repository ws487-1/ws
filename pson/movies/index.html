<style>:root{--bg:#000;--txt:#f5f5f7;--mut:#98989f;--acc:#2f7bff;--st:env(safe-area-inset-top);--sb:env(safe-area-inset-bottom);--nav:calc(62px + var(--sb));--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font-family:Inter,system-ui,-apple-system,sans-serif;overflow:hidden;overscroll-behavior:none}
body{touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{background:none;border:0;cursor:pointer;padding:0}button:focus{outline:none}button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.hidden{display:none!important}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* glass */
.glass,.btn{background:rgba(255,255,255,.09);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 20px rgba(0,0,0,.25)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding:0 18px;border-radius:14px;font-weight:650;font-size:15px;color:#fff;text-decoration:none;transition:transform .15s var(--ease),background .2s}
.btn:active{transform:scale(.96)}.btn .ic{width:19px;height:19px}
.btn.primary{background:linear-gradient(180deg,#4a8dff,#1f66f2);border-color:rgba(255,255,255,.25);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px rgba(31,102,242,.35)}
.btn.sm{height:34px;padding:0 12px;font-size:13px;border-radius:11px}
.btn.on{background:rgba(255,255,255,.92);color:#000}
.btn.round{width:38px;height:38px;padding:0;border-radius:50%}
/* pages */
#pages{position:fixed;inset:0}
.page{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;padding-bottom:calc(var(--nav) + 24px);visibility:hidden;opacity:0;transition:opacity .18s}
.page.on{visibility:visible;opacity:1}
.ptop{padding:calc(var(--st) + 18px) 16px 8px}.ptop h1{margin:0 0 14px;font-size:32px;font-weight:800;letter-spacing:-.03em}
/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;justify-content:space-around;padding:7px 8px calc(var(--sb) + 6px);background:rgba(18,18,20,.62);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border-top:1px solid rgba(255,255,255,.08)}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:4px 0;color:#8a8a90;font-size:10.5px;font-weight:600;transition:color .2s}
.tabbar .ic{width:24px;height:24px;stroke-width:1.9;transition:transform .2s var(--ease)}.tabbar button.on{color:#fff}.tabbar button.on .ic{transform:translateY(-1px)}
.tabbar button:active .ic{transform:scale(.88)}
/* hero */
.hero-wrap{position:relative;height:min(132vw,600px)}
.hslides{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.hslides::-webkit-scrollbar{display:none}
.hslide{position:relative;flex:none;width:100%;height:100%;scroll-snap-align:center;overflow:hidden}
.hslide>img.bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .5s}.hslide>img.bd.ok{opacity:1}
.hslide .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,transparent 22%,transparent 45%,rgba(0,0,0,.75) 75%,#000 100%)}
.hinfo{position:absolute;left:0;right:0;bottom:34px;padding:0 20px;display:flex;flex-direction:column;align-items:center;text-align:center}
.hinfo .hlogo{max-width:70%;max-height:110px;object-fit:contain;filter:drop-shadow(0 4px 18px rgba(0,0,0,.6));margin-bottom:12px;opacity:0;transition:opacity .4s}.hinfo .hlogo.ok{opacity:1}
.hinfo h2{margin:0 0 10px;font-size:30px;font-weight:800;letter-spacing:-.02em;text-shadow:0 2px 14px #000;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.hmeta{font-size:13px;color:#d6d6db;font-weight:500;margin-bottom:14px;display:flex;gap:6px;flex-wrap:wrap;justify-content:center}.hmeta i{font-style:normal;opacity:.5}
.hbtns{display:flex;gap:10px;width:100%;max-width:340px}.hbtns .btn{flex:1}
.dots{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:center;gap:6px}.dots i{width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.35);transition:width .3s var(--ease),background .3s}.dots i.on{width:18px;background:#fff}
/* rows */
.home{padding-top:6px}
.hrow{margin:0 0 26px}
.hh{display:flex;align-items:center;justify-content:space-between;padding:0 16px;margin-bottom:10px;gap:10px}
.hh h2{margin:0;font-size:19px;font-weight:750;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hh h2 img{width:24px;height:24px;border-radius:6px;flex:none}
.see{display:flex;align-items:center;color:var(--mut);font-size:14px;font-weight:600;flex:none}.see .ic{width:16px;height:16px}
.strip{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;padding:0 16px;scroll-snap-type:x mandatory;scroll-padding:0 16px}.strip::-webkit-scrollbar{display:none}
.strip .poster{flex:none;width:calc((100vw - 52px)/3.2);scroll-snap-align:start;border-radius:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:6px 14px}
.poster{position:relative;display:block;aspect-ratio:2/3;border-radius:12px;overflow:hidden;background:#151517;transform:translateZ(0);transition:transform .18s var(--ease)}
.poster:active{transform:scale(.96)}
.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .35s}.poster img.ok{opacity:1}
.poster .np{position:absolute;inset:0;display:grid;place-items:center;padding:10px;text-align:center;color:#c7c7cc;font-size:13px;font-weight:600}.poster.loaded .np{opacity:0}
.poster .np span{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.sk{background:linear-gradient(100deg,#141416 30%,#222225 50%,#141416 70%);background-size:300% 100%;animation:sh 1.3s linear infinite;pointer-events:none}@keyframes sh{from{background-position:100% 0}to{background-position:0 0}}
.sentinel{height:70px;display:grid;place-items:center}.spin{width:22px;height:22px;border:2.5px solid #333;border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--mut);padding:50px 28px;font-size:15px;line-height:1.5}.empty .btn{margin-top:14px}
/* layers (detail / grid / person) */
.layer{position:fixed;inset:0;z-index:20;background:#000;overflow:hidden;will-change:opacity,transform}
.lscroll{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding-bottom:calc(var(--nav) + 30px)}
.lbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:calc(var(--st) + 8px) 12px 10px;transition:background .25s}
.lbar .ttl{flex:1;font-weight:700;font-size:17px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .25s}
.lbar .sp{width:38px}
.layer.scrolled .lbar{background:rgba(10,10,12,.72);-webkit-backdrop-filter:blur(22px) saturate(170%);backdrop-filter:blur(22px) saturate(170%);border-bottom:1px solid rgba(255,255,255,.06)}.layer.scrolled .lbar .ttl{opacity:1}
.gtitle{padding:calc(var(--st) + 60px) 16px 6px;margin:0;font-size:28px;font-weight:800;letter-spacing:-.02em}
/* detail */
.dhero{position:relative;aspect-ratio:4/3.3;overflow:hidden;background:#0c0c0e}
.dhero>img.bd{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .4s}.dhero>img.bd.ok{opacity:1}
.dhero.pfb>img.bd{filter:blur(28px) saturate(1.4) brightness(.55);transform:scale(1.3)}
.dhero .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.45) 0,transparent 25%,transparent 50%,#000 100%)}
.dhero .logo{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);max-width:72%;max-height:34%;object-fit:contain;filter:drop-shadow(0 3px 14px rgba(0,0,0,.7));opacity:0;transition:opacity .35s}.dhero .logo.ok{opacity:1}
.dhero h2{position:absolute;left:18px;right:18px;bottom:10px;margin:0;font-size:clamp(24px,7.5vw,34px);font-weight:800;text-align:center;letter-spacing:-.02em;line-height:1.1;text-shadow:0 2px 14px #000;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.dbody{padding:8px 16px 0}
.meta{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:5px 10px;color:var(--mut);font-size:14px;font-weight:500}.meta .star{color:#ffd60a;display:flex;align-items:center;gap:3px}.meta .star .ic{width:13px;height:13px}.meta .cert{border:1px solid #555;border-radius:5px;padding:0 5px;font-size:12px}
.dbtns{display:flex;gap:10px;margin:16px 0 14px}.dbtns .btn{flex:1}
.overview{line-height:1.5;font-size:15px;color:#d1d1d6;margin:0 0 12px;-webkit-user-select:text;user-select:text}
.crew{font-size:13.5px;color:var(--mut);line-height:1.6;margin-bottom:12px}.crew b{color:#c7c7cc;font-weight:600;margin-right:4px}.crew a,.link{color:#fff;cursor:pointer;text-decoration:none}.crew a:active{opacity:.6}
.tags{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:6px}.tags .btn{height:30px;font-size:12.5px;padding:0 12px;border-radius:999px;font-weight:600}
h3{font-size:19px;font-weight:750;margin:24px 0 10px;letter-spacing:-.01em}
.trailer{position:relative;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#111}.trailer iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.hs{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}.hs::-webkit-scrollbar{display:none}
.castm{flex:none;width:78px;text-align:center;font-size:11px;color:var(--mut);line-height:1.3}.castm .ph{width:78px;height:78px;border-radius:50%;overflow:hidden;background:#1c1c1e;margin-bottom:7px;position:relative}.castm img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}.castm img.ok{opacity:1}
.castm .ph span{position:absolute;inset:0;display:grid;place-items:center;font-size:22px;font-weight:700;color:#555}.castm b{display:block;color:#fff;font-weight:600;font-size:12px}
.hs .poster{flex:none;width:112px;border-radius:10px}
/* person */
.phead{display:flex;gap:16px;padding:calc(var(--st) + 62px) 16px 4px;align-items:flex-end}
.phead .pp{width:110px;aspect-ratio:2/3;border-radius:14px;overflow:hidden;background:#1c1c1e;flex:none;position:relative}.phead .pp img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s}.phead .pp img.ok{opacity:1}
.phead h2{margin:0 0 6px;font-size:26px;font-weight:800;letter-spacing:-.02em}.phead p{margin:0;color:var(--mut);font-size:13.5px;line-height:1.5}
.bio{padding:10px 16px 0;color:#c7c7cc;font-size:14px;line-height:1.55;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}.bio.open{display:block}
.pseg{padding:14px 16px 4px}
.seg{display:flex;padding:3px;border-radius:12px}.seg button{flex:1;padding:7px;border-radius:9px;font-size:13px;font-weight:650;color:var(--mut);transition:background .2s,color .2s}.seg button.on{background:rgba(255,255,255,.18);color:#fff}
/* search page */
.sbox{display:flex;align-items:center;gap:8px;height:44px;border-radius:13px;padding:0 12px}.sbox input{flex:1;min-width:0;background:none;border:0;outline:none;font-size:16px;-webkit-appearance:none}.sbox input::-webkit-search-cancel-button{display:none}.sbox .ic{color:var(--mut)}
.svc{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:0 16px}.svc button{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11px;color:#c7c7cc;font-weight:500;text-align:center}.svc img{width:100%;aspect-ratio:1;border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.sec{padding:0 16px;margin:22px 0 12px;font-size:19px;font-weight:750}
.gchips{display:flex;flex-wrap:wrap;gap:8px;padding:0 16px}
.prow{display:flex;align-items:center;gap:12px;padding:8px 16px}.prow img,.prow .ph0{width:46px;height:46px;border-radius:50%;object-fit:cover;background:#1c1c1e}.prow b{display:block;font-size:15px}.prow span{font-size:12.5px;color:var(--mut)}
/* settings */
.settings{padding:0 16px}
.card{border-radius:16px;padding:4px 0;margin-bottom:18px;overflow:hidden}
.srow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.07);font-size:15px}.srow:last-child{border-bottom:0}
.srow select{margin-left:auto;background:rgba(255,255,255,.1);border:0;border-radius:9px;padding:6px 8px;max-width:55%}
.rowl li{display:flex;align-items:center;gap:10px;padding:9px 10px 9px 6px;border-bottom:1px solid rgba(255,255,255,.07);background:transparent;touch-action:pan-y}.rowl li:last-child{border-bottom:0}
.rowl{list-style:none;margin:0;padding:0}.rowl li span{flex:1;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rowl li img{width:24px;height:24px;border-radius:6px}.rowl .dot{width:24px;height:24px;border-radius:6px;background:rgba(255,255,255,.1);display:grid;place-items:center}.rowl .dot .ic{width:14px;height:14px;color:#aaa}
.rowl .handle{width:30px;height:34px;display:grid;place-items:center;color:#777;touch-action:none;cursor:grab}
.rowl .rm{width:30px;height:30px;display:grid;place-items:center;color:#ff453a}.rowl .rm .ic{width:17px;height:17px}
.rowl li.drag{position:relative;z-index:3;background:rgba(60,60,64,.95);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.slabel{font-size:12.5px;font-weight:650;color:var(--mut);text-transform:uppercase;letter-spacing:.05em;margin:18px 4px 8px}
.hint{color:var(--mut);font-size:12.5px;margin:-2px 4px 10px;line-height:1.45}
.achips{display:flex;flex-wrap:wrap;gap:8px}.achips img{width:18px;height:18px;border-radius:5px}
.filter{width:100%;height:40px;border-radius:12px;padding:0 12px;font-size:16px;outline:none;margin-bottom:10px;color:#fff}
.temp{width:100%;margin-top:6px}.tnote{font-size:11.5px;color:#ff9f0a;text-align:center;margin:6px 0 20px}
/* toast */
.toast{position:fixed;left:50%;bottom:calc(var(--nav) + 14px);z-index:80;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:11px 18px;border-radius:14px;font-size:14px;font-weight:600;transition:opacity .25s,transform .25s var(--ease);white-space:nowrap;background:rgba(40,40,44,.75)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(min-width:700px){.grid{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}.strip .poster{width:150px}.hero-wrap{height:min(60vw,640px)}}
.castm{display:block;align-self:flex-start}.castm .ph img{position:absolute;inset:0}.castm.loaded .ph span{display:none}
.hint .ic{width:14px;height:14px;vertical-align:-2px}
.moresvc{width:100%}.moresvc summary{list-style:none;margin:4px 0 10px}.moresvc summary::-webkit-details-marker{display:none}.moresvc[open] summary .ic{transform:rotate(180deg)}
/* ===== round 3 ===== */
html{background:#000;height:100%;min-height:100dvh}body{min-height:100dvh}
/* floating pill nav */
.tabbar{left:12px;right:12px;bottom:calc(max(var(--sb),10px) + 2px);padding:6px 6px;border-radius:24px;border:1px solid rgba(255,255,255,.12);background:rgba(28,28,32,.55);box-shadow:0 10px 30px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.1)}
.tabbar button{padding:5px 0;border-radius:18px}
:root{--nav:calc(max(env(safe-area-inset-bottom),10px) + 72px)}
.toast{bottom:calc(var(--nav) + 10px)}
/* white play */
.btn.primary{background:#fff;color:#0b0b0d;border-color:rgba(255,255,255,.9);box-shadow:0 8px 24px rgba(255,255,255,.12),inset 0 -1px 0 rgba(0,0,0,.08)}
/* hero carousel */
.hero-wrap{overflow:hidden}
.htrack{position:absolute;inset:0;touch-action:pan-y}
.hslide{position:absolute;inset:0;will-change:transform}
.htrack.moving .hslide{-webkit-mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask-image:linear-gradient(90deg,transparent 0,#000 7%,#000 93%,transparent 100%)}
.hinfo{bottom:118px;pointer-events:none}.hinfo h2{margin-bottom:8px}.hmeta{margin-bottom:0}
.hmeta .star{color:#ffd60a;display:inline-flex;align-items:center;gap:3px}.hmeta .star .ic{width:12px;height:12px}
.hfixed{position:absolute;left:0;right:0;bottom:16px;display:flex;flex-direction:column;align-items:center;gap:16px;padding:0 20px;z-index:2}
.dots{position:static;display:flex;gap:6px}.dots i{position:relative;overflow:hidden;width:6px;height:6px;border-radius:3px;background:rgba(255,255,255,.3);transition:width .35s cubic-bezier(.2,.8,.2,1)}
.dots i b{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(0)}.dots i.on{width:26px}.dots i:not(.on) b{transform:scaleX(0)!important}
/* detail header extension */
.dhero{--ext:calc(var(--st) + 58px);aspect-ratio:auto;height:calc(var(--ext) + 56.25vw + 30px);max-height:calc(var(--ext) + 460px)}
.dhero>img.bd{top:var(--ext);height:calc(56.25vw);max-height:420px;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 34px);mask-image:linear-gradient(180deg,transparent 0,#000 34px)}
.dhero .ebd{position:absolute;left:0;right:0;top:0;width:100%;height:calc(var(--ext) + 40px);object-fit:cover;object-position:top;transform:scaleY(-1) scale(1.15);filter:blur(22px) saturate(1.25) brightness(.7);opacity:0;transition:opacity .4s}.dhero .ebd.ok{opacity:.9}
.dhero .shade{background:linear-gradient(180deg,transparent 0,transparent 55%,rgba(0,0,0,.6) 78%,#000 100%)}
.dhero.pfb>img.bd{top:0;height:100%;-webkit-mask-image:none;mask-image:none}
.lbar{z-index:5}.lbar .btn.round{position:relative;z-index:6}
.detail.scrolled .lbar{background:rgba(10,10,12,.78)}
.tseg{margin:0}
#sSeg{margin:10px 0 0}
/* sources */
.srcl{padding:6px 16px}
.src{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border-radius:14px;margin-bottom:9px;text-align:left}
.src b{display:block;font-size:15px;font-weight:650}.src span{font-size:12px;color:var(--mut);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.src .go{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#fff;color:#000;display:grid;place-items:center;flex:none}.src .go .ic{width:15px;height:15px}
.shead{display:flex;gap:14px;padding:calc(var(--st) + 62px) 16px 6px;align-items:center}.shead img{width:64px;border-radius:10px;aspect-ratio:2/3;object-fit:cover;background:#1c1c1e}.shead h2{margin:0;font-size:22px;font-weight:800}.shead p{margin:3px 0 0;color:var(--mut);font-size:13px}
.seasons{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:6px 16px 4px}.seasons::-webkit-scrollbar{display:none}.seasons .btn{flex:none}

<script>'use strict';
const API_KEY='79d7c854f26de5ac978215ce03ff0c87',API='https://api.themoviedb.org/3',IMG='https://image.tmdb.org/t/p/';

const sources = [
{ name: "STELLAR", movieUrl: id => `https://stellar.rip/en/watch/embed/movie/${id}`, seriesUrl: (id,s,e)=>`https://stellar.rip/en/watch/embed/tv/${id}-${s}-${e}` },
  { name: "ATLANTIC", movieUrl: id => `https://atlantic.st/embed/movie/${id}`, seriesUrl: (id,s,e)=>`https://atlantic.st/embed/tv/${id}/${s}/${e}` },
  { name: "HIVE", movieUrl: id => `https://vidhive.lol/embed/movie/${id}`, seriesUrl: (id,s,e)=>`https://vidhive.lol/embed/tv/${id}/${s}/${e}` },
];
/* ===================================================================================== */

const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
/* ---------- one-time migration from the previous wills.im/pson/movies build ----------
   Old build: 'history' (same JSON shape, kept as is), 'favorites' (JSON, oldest first), raw strings 'accentColor',
   'posterBorderEnabled' ('true'/'false'), 'defaultMovieSource'/'defaultTVSource' (source NAME), 'theme', 'bgPreset'.
   Old keys are left in place (no data loss, old build still works if rolled back). */
(()=>{const raw=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
  if(!LS.get('mig5',false)){
    const old=LS.get('favorites',null);if(Array.isArray(old)&&old.length){const cur=LS.get('favorites2',[]);const have=new Set(cur.map(f=>f.media_type+f.id));
      const add=old.slice().reverse().filter(f=>f&&f.id&&(f.media_type==='movie'||f.media_type==='tv')&&!have.has(f.media_type+f.id)).map(f=>({id:f.id,media_type:f.media_type,title:f.title,name:f.title,poster_path:f.poster_path||null,popularity:0}));
      LS.set('favorites2',[...cur,...add])}
    const ac=raw('accentColor');if(ac&&/^#[0-9a-f]{6}$/i.test(ac)&&raw('accent')==null)LS.set('accent',ac.toLowerCase());
    const pb=raw('posterBorderEnabled');if(pb!=null&&raw('posterBorders')==null)LS.set('posterBorders',pb==='true');
    LS.set('mig5',true)}
  // default sources: old stores the NAME, new stores an index into sources[]; resolved by name while the new key is unset
  for(const[o,n]of[['defaultMovieSource','defSrcMovie'],['defaultTVSource','defSrcTv']]){const name=raw(o);if(name&&raw(n)==null){const i=sources.findIndex(s=>s.name===name);if(i>=0)LS.set(n,i)}}
  // anyone with existing data is treated as already onboarded
  if(raw('onboarded')==null&&['history','favorites','favorites2','rows4','accentColor','defaultMovieSource','defaultTVSource','posterBorderEnabled','theme','bgPreset','posterBorders','betterPosters','showAI'].some(k=>raw(k)!=null))LS.set('onboarded',true)})();
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ic=(n,c='')=>`<svg class="ic ${c}"><use href="#i-${n}"/></svg>`;
const h=(html)=>{const t=document.createElement('template');t.innerHTML=html.trim();return t.content.firstElementChild};
let toastT;function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1900)}
const cache=new Map();
function tm(path,params={}){const u=new URL(API+path);u.searchParams.set('api_key',API_KEY);u.searchParams.set('include_adult','false');for(const[k,v]of Object.entries(params))if(v!=null&&v!=='')u.searchParams.set(k,v);const key=u.toString();
  if(!cache.has(key))cache.set(key,fetch(key).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()}).catch(e=>{cache.delete(key);throw e}));return cache.get(key)}
const TN={movie:'Movies',tv:'Shows',all:''};
const yearOf=x=>(x.release_date||x.first_air_date||'').slice(0,4);
const typeOf=x=>x.media_type||(x.first_air_date!=null||x.name&&!x.title?'tv':'movie');

/* ---------- progressive images: medium first, then high-res swapped in once decoded (no flicker) ---------- */
const upQ=[];let upN=0;
function pump(){while(upN<4&&upQ.length){const[img,url]=upQ.shift();if(!img.isConnected||img._better)continue;upN++;const hi=new Image();hi.src=url;
  (hi.decode?hi.decode():new Promise((r,j)=>{hi.onload=r;hi.onerror=j})).then(()=>{if(img.isConnected&&!img._better)img.src=url}).catch(()=>{}).finally(()=>{upN--;pump()})}}
const upIO=new IntersectionObserver(es=>{for(const e of es)if(e.isIntersecting){upIO.unobserve(e.target);upQ.push([e.target,e.target.dataset.hi]);pump()}},{rootMargin:'200px'});
function prog(img,path,lo,hi,{lazy=true,cls='ok',onok}={}){if(!path)return;img.decoding='async';if(lazy)img.loading='lazy';img.src=IMG+lo+path;
  img.onload=()=>{img.classList.add(cls);onok&&onok();if(hi&&!img.dataset.hi){img.dataset.hi=IMG+hi+path;upIO.observe(img)}};img.onerror=()=>img.remove()}

/* ---------- catalog definitions ---------- */
const today=()=>new Date().toISOString().slice(0,10);
const dk=(t,s)=>(t==='movie'?'primary_release_date':'first_air_date')+s;
const D=(t,o)=>[`/discover/${t}`,{sort_by:'popularity.desc',...o}];
const dec=y=>t=>D(t,{[dk(t,'.gte')]:`${y}-01-01`,[dk(t,'.lte')]:`${y+9}-12-31`,'vote_count.gte':200,sort_by:'vote_average.desc'});
const G=(m,tv)=>t=>D(t,{with_genres:t==='movie'?m:tv,'vote_count.gte':50});
const LANG=(l,x={})=>t=>D(t,{with_original_language:l,'vote_count.gte':30,...x});
const CO=c=>t=>D(t,{with_companies:c});
const NET=n=>t=>t==='tv'?D(t,{with_networks:n}):null;
// [label, fn(type), types, standaloneLabel?]
const CATS={
 lists:{name:'Lists',items:{
  popular:['Popular',t=>[`/${t}/popular`,{}]],trending:['Trending',t=>[`/trending/${t}/week`,{}]],top:['Top Rated',t=>[`/${t}/top_rated`,{}]],
  now:['Now Playing',t=>t==='movie'?['/movie/now_playing',{}]:null,['movie'],1],soon:['Coming Soon',t=>t==='movie'?['/movie/upcoming',{}]:null,['movie'],1],
  air:['On The Air',t=>t==='tv'?['/tv/on_the_air',{}]:null,['tv'],1],airing:['Airing Today',t=>t==='tv'?['/tv/airing_today',{}]:null,['tv'],1],
  new:['New',t=>D(t,{sort_by:dk(t,'.desc'),[dk(t,'.lte')]:today(),'vote_count.gte':25})],hidden:['Hidden Gems',t=>D(t,{sort_by:'vote_average.desc','vote_count.gte':300,'vote_count.lte':3000})]}},
 genres:{name:'Genres',items:{action:['Action',G(28,10759)],comedy:['Comedy',G(35,35)],drama:['Drama',G(18,18)],thriller:['Thriller',G(53,'80|9648')],horror:['Horror',G(27,9648)],scifi:['Sci‑Fi & Fantasy',G('878|14',10765)],crime:['Crime',G(80,80)],romance:['Romance',G(10749,'10749|18')],animation:['Animation',G(16,16)],family:['Family',G(10751,10751)],kids:['Kids',G('10751,16',10762)],doc:['Documentary',G(99,99)],war:['War & History',G('10752|36',10768)],western:['Western',G(37,37)],mystery:['Mystery',G(9648,9648)],reality:['Reality',t=>t==='tv'?D(t,{with_genres:10764}):null,['tv']]}},
 world:{name:'World',items:{anime:['Anime',LANG('ja',{with_genres:16})],kdrama:['Korean',LANG('ko')],bolly:['Bollywood',LANG('hi')],spanish:['Spanish',LANG('es')],french:['French',LANG('fr')],japanese:['Japanese',LANG('ja',{without_genres:16})],turkish:['Turkish',LANG('tr')],nordic:['Nordic',LANG('da|sv|no|fi|is')],chinese:['Chinese',LANG('zh|cn')],italian:['Italian',LANG('it')],german:['German',LANG('de')]}},
 decades:{name:'Decades',items:{d70:['70s',dec(1970)],d80:['80s',dec(1980)],d90:['90s',dec(1990)],d00:['2000s',dec(2000)],d10:['2010s',dec(2010)],d20:['2020s',dec(2020)]}},
 studios:{name:'Studios & networks',items:{a24:['A24',CO(41077)],pixar:['Pixar',CO(3)],marvel:['Marvel Studios',CO(420)],ghibli:['Studio Ghibli',CO(10342)],blum:['Blumhouse',CO(3172)],lucas:['Lucasfilm',CO(1)],dc:['DC',CO('128064|9993')],dreamworks:['DreamWorks',CO(521)],hbo:['HBO',NET(49),['tv']],bbc:['BBC',NET('4|332|3'),['tv']],fx:['FX',NET(88),['tv']],amc:['AMC',NET(174),['tv']]}}};
const CI={};for(const g of Object.values(CATS))for(const[k,v]of Object.entries(g.items))CI[k]=v;

/* ---------- streaming providers (worldwide aggregate) ---------- */
const WORLD=['US','GB','CA','AU','IN','DE','FR','ES','BR','MX','JP','KR','IT','NL'];
const ALIAS={119:[9,119],8:[8,1796],531:[531,2303,582],1899:[1899,384]},HIDE=new Set([9,1796,2303,582,384,2,3,7,10,68,35,192,2285,201]);
const NAMES={119:'Prime Video',337:'Disney+',350:'Apple TV+',1899:'HBO Max',531:'Paramount+',39:'NOW',15:'Hulu',283:'Crunchyroll',386:'Peacock',38:'BBC iPlayer',8:'Netflix'};
const FEAT=[8,119,337,350,1899,531,15,386,283,39,38,41,103,11,220,73,300,457,122,309,232,237,190,43,526,258];
let PROV=LS.get('provCache4',{});for(const id of[8,119,337,350,1899,531,15])if(!PROV[id])PROV[id]={n:NAMES[id],r:id==15?['US','JP']:['US','GB','CA','AU']};
let provList=null;
async function loadProviders(){if(provList)return provList;const[a,b]=await Promise.all(['movie','tv'].map(t=>tm(`/watch/providers/${t}`)));const m=new Map();
  for(const p of[...a.results,...b.results]){const o=m.get(p.provider_id)||{id:p.provider_id,n:NAMES[p.provider_id]||p.provider_name,l:p.logo_path,dp:{}};Object.assign(o.dp,p.display_priorities||{});m.set(p.provider_id,o)}
  for(const[k,al]of Object.entries(ALIAS)){const o=m.get(+k);if(o)for(const x of al){const y=m.get(x);if(y)o.dp={...y.dp,...o.dp}}}
  const KEY=['US','GB','CA','AU','IN','DE','FR','BR','ES','JP'],seen=new Set();
  provList=[...m.values()].filter(p=>!HIDE.has(p.id)&&!/store|channel|amazon video|rent|buy/i.test(p.n)).map(p=>{p.r=Object.keys(p.dp);const pr=KEY.map(k=>p.dp[k]).filter(x=>x!=null);p.score=pr.length?Math.min(...pr):999;return p}).filter(p=>p.score<999)
   .sort((x,y)=>{const fx=FEAT.indexOf(x.id),fy=FEAT.indexOf(y.id);if(fx>=0||fy>=0)return(fx<0?99:fx)-(fy<0?99:fy);return y.r.length-x.r.length}).filter(p=>{const k=p.n.toLowerCase().replace(/[^a-z0-9]/g,'');if(seen.has(k))return 0;seen.add(k);return 1});
  for(const p of provList)PROV[p.id]={n:p.n,l:p.l,r:p.r};LS.set('provCache4',PROV);return provList}
let GEN={movie:{},tv:{}};Promise.all(['movie','tv'].map(t=>tm(`/genre/${t}/list`).then(r=>r.genres.forEach(g=>GEN[t][g.id]=g.name)))).catch(()=>{});

/* ---------- rows: "<movie|tv|all>:<key>" ---------- */
const S={rows:LS.get('rows4',null),region:'ALL',fav:LS.get('favorites2',[]),addType:'movie'};
const DEFAULT_ROWS=['cw','byw','movie:popular','tv:popular','movie:trending','tv:trending','movie:top','tv:top','movie:now','tv:air',...[8,119,337,350,1899,531,15].flatMap(p=>[`movie:p${p}`,`tv:p${p}`])];
if(!S.rows)S.rows=DEFAULT_ROWS.slice();if(!LS.get('bywMig',false)){if(!S.rows.includes('byw'))S.rows.splice(S.rows.indexOf('cw')+1,0,'byw');LS.set('bywMig',true);LS.set('rows4',S.rows)}if(!LS.get('cwMig',false)){if(!S.rows.includes('cw'))S.rows.unshift('cw');LS.set('cwMig',true);LS.set('rows4',S.rows)}const saveRows=()=>{LS.set('rows4',S.rows);homeDirty=true};
const SORTN={new:'New',top:'Top'};
function rowInfo(id){if(id==='cw')return{id,cw:true,label:'Continue Watching'};if(id==='byw')return{id,byw:true,label:'Recommended'};const[t,key,sort]=id.split(':');if(!TN.hasOwnProperty(t))return null;
  if(/^p\d+$/.test(key)){const pid=+key.slice(1),p=PROV[pid]||{n:'Service '+pid};return{id,t,prov:pid,sort:sort||'',name:p.n,label:`${p.n} ${TN[t]}`.trim()+(sort?` · ${SORTN[sort]}`:''),logo:p.l}}

  const bp=!!LS.get('betterPosters',false),tg=(k,on,label,sub)=>`<div class="srow"><div>${label}<small>${sub}</small></div><button class="tog ${on?'on':''}" data-t data-k="${k}"></button></div>`;
  const P=[
   `<div class="onbp center"><div class="onbicon">${ic('film')}</div><h1>Welcome</h1><p>Your movies and shows, beautifully organised. Let’s set things up. It takes about 30 seconds.</p></div>`,
   `<div class="onbp"><h1>Poster style</h1><p>Pick the artwork you like best.</p><div class="onbposters" data-s="1"><button data-pick class="${bp?'':'on'}"><div class="bpi"><img data-tm alt="The Rookie, TMDB poster"></div><b>Regular</b></button>${bpArrow()}<button data-pick data-better class="${bp?'on':''}"><div class="bpi"><img src="https://btttr.cc/poster/imdb/poster-default/${ROOKIE.imdb}.jpg" alt="The Rookie, better poster"></div><b>Better posters</b></button></div></div>`,
   `<div class="onbp"><h1>Your services</h1><p>We’ll put them on your Home screen.</p><div class="onbsvc" data-m="1"></div></div>`,
   `<div class="onbp"><h1>Favourite genres</h1><p>Choose a few. We’ll add rows for them.</p><div class="onbg" data-m="1"></div></div>`,
   `<div class="onbp"><h1>Layout</h1><p>Make it yours.</p><div class="card glass onbopts">${tg('posterTitles',LS.get('posterTitles',false),'Titles under posters','Show the name below every poster')}${tg('posterBorders',LS.get('posterBorders',true),'Poster borders','Subtle hairline edge')}${tg('largePosters',String(LS.get('gridCols','3'))==='2','Large posters','2 per row in Library and Search')}</div></div>`,
   `<div class="onbp"><h1>AI search</h1><p>Normal search by title always works. AI search is an optional extra: describe what you’re in the mood for in plain words and get matching titles.</p><div class="card glass onbopts">${tg('showAI',LS.get('showAI',true),'Show AI search','Adds an optional AI switch next to normal search')}</div></div>`,
   `<div class="onbp center"><div class="onbicon ok">${ic('check')}</div><h1>You’re all set</h1><p>You can change any of this later in Settings.</p></div>`];
  pages.innerHTML=P.join('');const ps=$$('.onbp',pages);$('.onbdots',o).innerHTML=ps.map(()=>'<i></i>').join('');const dots=$$('.onbdots i',o);
  $$('[data-s],[data-m]',pages).forEach(x=>sel(x,x.dataset.m));$$('[data-t]',pages).forEach(t=>t.onclick=()=>t.classList.toggle('on'));
  rookieTm($('[data-tm]',pages));
  loadProviders().then(pl=>{const box=$('.onbsvc',pages);const btn=p=>`<button data-pick data-id="${p.id}"><img src="${IMG}w154${p.l}" alt="" loading="lazy"><span>${esc(p.n)}</span></button>`;box.innerHTML=pl.slice(0,12).map(btn).join('');
    const rest=pl.slice(12);if(rest.length){const d=h(`<details class="onbmore"><summary class="btn sm">Show all services${ic('chev-d')}</summary><div class="onbsvc" data-m="1">${rest.map(btn).join('')}</div></details>`);box.after(d);sel($('.onbsvc',d),true)}}).catch(()=>{});
  const fillG=()=>{$('.onbg',pages).innerHTML=Object.entries(GEN.movie||{}).slice(0,18).map(([id,n])=>`<button class="btn sm" data-pick data-g="${id}">${esc(n)}</button>`).join('')};
  if(Object.keys(GEN.movie||{}).length)fillG();else tm('/genre/movie/list').then(r=>{r.genres.forEach(g=>GEN.movie[g.id]=g.name);fillG()}).catch(()=>{});
  tm('/trending/movie/week').then(r=>{const x=r.results.find(x=>x.backdrop_path);if(x){const im=$('.onbbg',o);im.src=IMG+'w780'+x.backdrop_path;im.onload=()=>im.classList.add('ok')}}).catch(()=>{});
  let i=0;const show=(n,dir)=>{const prev=ps[i];i=n;ps.forEach((p,k)=>p.classList.toggle('on',k===i));dots.forEach((d,k)=>d.classList.toggle('on',k===i));
    if(prev&&prev!==ps[i]){ps[i].animate([{opacity:0,transform:`translateX(${dir*40}px)`},{opacity:1,transform:'none'}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'})}
    $('.onbback',o).style.visibility=i?'visible':'hidden';$('.onbnext',o).textContent=i===ps.length-1?'Get started':i?'Continue':'Let’s go'};
  const save=()=>{LS.set('betterPosters',!!$('[data-better]',pages).classList.contains('on'));
    $$('[data-k]',pages).forEach(t=>{const on=t.classList.contains('on');if(t.dataset.k==='largePosters')LS.set('gridCols',on?'2':'3');else LS.set(t.dataset.k,on)});
    const svc=$$('.onbsvc [data-pick].on',pages).map(b=>+b.dataset.id),gen=$$('.onbg [data-pick].on',pages).map(b=>+b.dataset.g);
    if(svc.length||gen.length){const base=svc.length?S.rows.filter(id=>!/^(movie|tv):p\d+/.test(id)):S.rows.slice();const add=[...svc.flatMap(p=>[`movie:p${p}`,`tv:p${p}`]),...gen.map(g=>`movie:g${g}`)];S.rows=[...base,...add.filter(x=>!base.includes(x))];saveRows()}
    const de=document.documentElement;de.classList.toggle('pborder',!!LS.get('posterBorders',true));de.classList.toggle('ptitles',!!LS.get('posterTitles',false));applyLook();syncAI();renderHome();if(curTab==='settings')renderSettings()};
  const close=done=>{LS.set('onboarded',true);if(done)save();o.animate([{opacity:1},{opacity:0}],{duration:220}).onfinish=()=>o.remove()};
  $('.onbnext',o).onclick=()=>i<ps.length-1?show(i+1,1):close(true);$('.onbback',o).onclick=()=>i&&show(i-1,-1);$('.onbskip',o).onclick=()=>close(false);
  o.animate([{opacity:0},{opacity:1}],{duration:260});show(0,1)}
if(!LS.get('onboarded',false))openOnboarding();

/* ---------- accent, poster size, measured app height ---------- */
const ACCENTS=[['','Classic (white + green)'],['#2f7bff','Blue'],['#7c5cff','Purple'],['#ff375f','Pink'],['#ff9f0a','Orange'],['#30d158','Green'],['#64d2ff','Sky']];
function accTxt(hex){const n=parseInt(hex.slice(1),16);const L=[n>>16&255,n>>8&255,n&255].map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4}).reduce((a,v,i)=>a+v*[.2126,.7152,.0722][i],0);return (L+.05)/.05>=1.05/(L+.05)?'#000':'#fff'}
function setAppH(){const de=document.documentElement;const sa=navigator.standalone===true||matchMedia('(display-mode: standalone)').matches;const port=innerHeight>=innerWidth;
  const sh=sa&&port?Math.max(screen.height,screen.width):0;de.style.setProperty('--scrH',Math.max(innerHeight,de.clientHeight,sh)+'px')}
function applyLook(){const de=document.documentElement,a=LS.get('accent','');de.classList.toggle('acc',!!a);
  if(a){de.style.setProperty('--acc',a);de.style.setProperty('--accTxt',accTxt(a))}else{de.style.removeProperty('--acc');de.style.removeProperty('--accTxt')}
  const cols=String(LS.get('gridCols','3'))==='2'?2:3;de.style.setProperty('--pcols',cols);de.style.setProperty('--pgap',cols===2?'14px':'10px');
  setAppH()}
applyLook();['resize','orientationchange','pageshow'].forEach(ev=>addEventListener(ev,()=>{setAppH();setTimeout(setAppH,300)}));
/* Pinned top blur is only shown while the scroller is at (or pulled past) the top. */
function topFlag(sc,el){const f=()=>el.classList.toggle('notop',sc.scrollTop>40);sc.addEventListener('scroll',f,{passive:true});f()}
topFlag($('#pg-home'),$('#pages'));
/* No pinch zoom / horizontal page drift in the standalone app (iOS ignores user-scalable=no) */
['gesturestart','gesturechange'].forEach(ev=>document.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
document.addEventListener('touchmove',e=>{if(e.touches.length>1&&e.cancelable)e.preventDefault()},{passive:false});

/* ---------- tabbar height for the lvh-anchored nav (measured from the element, never from innerHeight) ---------- */
(()=>{const tb=$('#tabbar');const m=()=>document.documentElement.style.setProperty('--tbh',tb.offsetHeight+'px');m();addEventListener('resize',m);addEventListener('pageshow',m)})();
</script>
</body>
